:{"end":{"column":82,"line":33},"start":{"column":8,"line":33}}},{"id":"21","mutatorName":"LogicalOperator","replacement":"showVersions || versionsPanelSlot","statusReason":"expected <"+"div data-testid=\"versions\"><"+"/div> to be null","status":"Killed","static":false,"testsCompleted":3,"killedBy":["10"],"coveredBy":["8","9","10","11","12"],"location":{"end":{"column":41,"line":34},"start":{"column":8,"line":34}}}],"source":"import { cn } from '@mastra/playground-ui/utils/cn';\nimport type { ReactNode } from 'react';\n\nexport interface DatasetItemsLayoutProps {\n  /** The left column: toolbar + optional notice + items list. */\n  listSlot: ReactNode;\n  /** Right column when an item is selected. Takes precedence over the versions panel. */\n  detailPanelSlot?: ReactNode;\n  /** Right column when the versions panel is open. Suppressed if `detailPanelSlot` is set. */\n  versionsPanelSlot?: ReactNode;\n}\n\n/**\n * Pure 2-column layout shell for the dataset items view. Owns no state and\n * fetches no data — pass slots in. The right column shows the detail panel\n * (preferred) or the versions panel (fallback), and collapses entirely when\n * neither is present.\n */\nexport function DatasetItemsLayout({ listSlot, detailPanelSlot, versionsPanelSlot }: DatasetItemsLayoutProps) {\n  const showDetail = !!detailPanelSlot;\n  const showVersions = !showDetail && !!versionsPanelSlot;\n\n  return (\n    <"+"div\n      className={cn('grid h-full max-h-full min-h-0', {\n        'grid-cols-[1fr_1fr] gap-4': showDetail,\n        'grid-cols-[1fr_auto]': showVersions,\n      })}\n    >\n      <"+"div className={cn('grid max-w-full content-start gap-8 overflow-y-auto pt-3 pl-6', showVersions && 'pr-6')}>\n        {listSlot}\n      <"+"/div>\n      {showDetail && <"+"div className=\"h-full min-h-0 py-3\">{detailPanelSlot}<"+"/div>}\n      {showVersions && versionsPanelSlot}\n    <"+"/div>\n  );\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"src/lib/route-header/__tests__/route-header-handles.test.tsx":{"tests":[{"id":"0","name":"route header handles every page under RootLayout inherits or declares breadcrumb data"},{"id":"1","name":"route header handles resolves declared breadcrumb handles to non-empty crumbs"},{"id":"2","name":"route header handles resolves declared breadcrumb handles to accessible page headings"},{"id":"3","name":"route header handles does not throw when route params contain malformed URI encoding"},{"id":"4","name":"route header handles allows deeper route handles to clear inherited docs links"},{"id":"5","name":"route header handles renders only the active route header action owner"},{"id":"6","name":"route header handles lets page-level crumbs override route-handle crumbs"}],"source":"import { render, screen, waitFor } from '@testing-library/react';\nimport { createMemoryRouter, Outlet, RouterProvider } from 'react-router';\nimport type { RouteObject } from 'react-router';\nimport { describe, expect, it } from 'vitest';\nimport { RouteHeader } from '../route-header';\nimport { RouteHeaderActions, RouteHeaderActionsProvider, RouteHeaderActionsSlot } from '../route-header-actions';\nimport { RouteHeaderCrumbs, RouteHeaderCrumbsProvider } from '../route-header-crumbs';\nimport { getRouteHeaderHeading } from '../route-heading';\nimport type { CrumbDef, RouteHeaderHandle } from '../types';\nimport { useRouteHeader } from '../use-route-header';\nimport { routes } from '@/App';\n\nfunction getAppRoutes() {\n  const rootRoute = routes.find(route => route.children?.some(child => child.path === '/agents'));\n  if (!rootRoute?.children) {\n    throw new Error('Could not find the main app route tree.');\n  }\n\n  return rootRoute.children;\n}\n\nfunction joinPath(basePath: string, route: RouteObject) {\n  if (route.index) return basePath || '/';\n  if (!route.path) return basePath;\n  if (route.path.startsWith('/')) return route.path;\n\n  const normalizedBase = basePath === '/' ? '' : basePath.replace(/\\/$/, '');\n  return `${normalizedBase}/${route.path}`.replace(/\\/+/g, '/');\n}\n\nfunction getHandle(route: RouteObject) {\n  return route.handle as RouteHeaderHandle | undefined;\n}\n\nfunction hasRouteCrumbs(route: RouteObject) {\n  return Boolean(getHandle(route)?.crumbs);\n}\n\nfunction isRoutableAppPage(route: RouteObject) {\n  return Boolean(route.element && (route.path || route.index));\n}\n\nfunction collectRoutesMissingCrumbs(routesToCheck: RouteObject[], basePath = '', hasParentCrumbs = false) {\n  const missingRoutes: string[] = [];\n\n  for (const route of routesToCheck) {\n    const routePath = joinPath(basePath, route);\n    const hasCrumbs = hasParentCrumbs || hasRouteCrumbs(route);\n\n    if (isRoutableAppPage(route) && !hasCrumbs) {\n      missingRoutes.push(routePath);\n    }\n\n    if (route.children) {\n      missingRoutes.push(...collectRoutesMissingCrumbs(route.children, routePath, hasCrumbs));\n    }\n  }\n\n  return missingRoutes;\n}\n\nfunction sampleParamsForRoute(path: string) {\n  const params: Record<"+"string, string> = {};\n\n  for (const match of path.matchAll(/:([A-Za-z0-9_]+)/g)) {\n    const paramName = match[1];\n    params[paramName] = `${paramName}-fixture`;\n  }\n\n  return params;\n}\n\nfunction resolveCrumbs(routePath: string, handle: RouteHeaderHandle): CrumbDef[] {\n  if (!handle.crumbs) return [];\n  if (typeof handle.crumbs === 'function') {\n    return handle.crumbs({\n      params: sampleParamsForRoute(routePath),\n      pathname: routePath.replace(/:([A-Za-z0-9_]+)/g, '$1-fixture'),\n    });\n  }\n\n  return handle.crumbs;\n}\n\nfunction collectRouteHandles(routesToCheck: RouteObject[], basePath = '') {\n  const handles: Array<"+"{ path: string; handle: RouteHeaderHandle }> = [];\n\n  for (const route of routesToCheck) {\n    const routePath = joinPath(basePath, route);\n    const handle = getHandle(route);\n\n    if (handle) {\n      handles.push({ path: routePath, handle });\n    }\n\n    if (route.children) {\n      handles.push(...collectRouteHandles(route.children, routePath));\n    }\n  }\n\n  return handles;\n}\n\nfunction hasRenderableNode(crumb: CrumbDef) {\n  if (!crumb.id) return false;\n  if ('label' in crumb) return crumb.label !== '';\n  if ('node' in crumb) return crumb.node !== null && crumb.node !== undefined && crumb.node !== '';\n  return Boolean(crumb.Component);\n}\n\nfunction RouteHeaderProbe() {\n  const { docs } = useRouteHeader();\n  return <"+"div data-testid=\"route-docs\">{docs?.href ?? 'none'}<"+"/div>;\n}\n\nfunction RouteHeaderOverrideProbe() {\n  return <"+"RouteHeaderCrumbs crumbs={[{ id: 'override', label: 'Override crumb' }]} />;\n}\n\ndescribe('route header handles', () => {\n  it('every page under RootLayout inherits or declares breadcrumb data', () => {\n    // Scope: only routes nested in the main RootLayout subtree are covered.\n    // MinimalRootLayout pages (e.g. /agents/:agentId/session) and unauthenticated\n    // pages (/login, /signup) intentionally do not render <"+"RouteHeader/> and are\n    // excluded. A child route is considered \"covered\" when its parent provides\n    // crumbs — the test does not require leaf routes to append their own leaf.\n    expect(collectRoutesMissingCrumbs(getAppRoutes())).toEqual([]);\n  });\n\n  it('resolves declared breadcrumb handles to non-empty crumbs', () => {\n    const invalidHandles = collectRouteHandles(getAppRoutes()).flatMap(({ path, handle }) => {\n      const crumbs = resolveCrumbs(path, handle);\n      if (crumbs.length === 0 || crumbs.some(crumb => !hasRenderableNode(crumb))) {\n        return [path];\n      }\n\n      return [];\n    });\n\n    expect(invalidHandles).toEqual([]);\n  });\n\n  it('resolves declared breadcrumb handles to accessible page headings', () => {\n    const invalidHandles = collectRouteHandles(getAppRoutes()).flatMap(({ path, handle }) => {\n      const crumbs = resolveCrumbs(path, handle);\n      const hasUntitledComponentCrumb = crumbs.some(crumb => 'Component' in crumb && !crumb.heading?.trim());\n      if (hasUntitledComponentCrumb || !getRouteHeaderHeading(crumbs)) {\n        return [path];\n      }\n\n      return [];\n    });\n\n    expect(invalidHandles).toEqual([]);\n  });\n\n  it('does not throw when route params contain malformed URI encoding', () => {\n    const scheduleHandle = collectRouteHandles(getAppRoutes()).find(\n      ({ path }) => path === '/workflows/schedules/:scheduleId',\n    )?.handle;\n\n    expect(scheduleHandle?.crumbs).toBeTypeOf('function');\n    expect(() => {\n      if (typeof scheduleHandle?.crumbs !== 'function') return;\n      const crumbs = scheduleHandle.crumbs({\n        params: { scheduleId: '%E0%A4%A' },\n        pathname: '/workflows/schedules/%E0%A4%A',\n      });\n      expect(crumbs.at(-1)).toMatchObject({ label: '%E0%A4%A' });\n    }).not.toThrow();\n  });\n\n  it('allows deeper route handles to clear inherited docs links', async () => {\n    const router = createMemoryRouter(\n      [\n        {\n          path: '/',\n          element: <"+"Outlet />,\n          handle: { docs: { href: 'https://example.com/docs' } },\n          children: [\n            {\n              path: 'child',\n              element: <"+"RouteHeaderProbe />,\n              handle: { crumbs: [{ id: 'child', label: 'Child' }], docs: () => undefined },\n            },\n          ],\n        },\n      ],\n      { initialEntries: ['/child'] },\n    );\n\n    render(<"+"RouterProvider router={router} />);\n\n    await waitFor(() => expect(screen.getByTestId('route-docs').textContent).toBe('none'));\n  });\n\n  it('renders only the active route header action owner', async () => {\n    render(\n      <"+"RouteHeaderActionsProvider>\n        <"+"RouteHeaderActionsSlot />\n        <"+"RouteHeaderActions owner=\"parent\">Parent action<"+"/RouteHeaderActions>\n        <"+"RouteHeaderActions owner=\"child\" priority={1}>\n          Child action\n        <"+"/RouteHeaderActions>\n      <"+"/RouteHeaderActionsProvider>,\n    );\n\n    await waitFor(() => expect(screen.queryByText('Parent action')).toBeNull());\n    expect(screen.getByText('Child action')).toBeTruthy();\n  });\n\n  it('lets page-level crumbs override route-handle crumbs', async () => {\n    const router = createMemoryRouter(\n      [\n        {\n          path: '/',\n          element: (\n            <"+"RouteHeaderCrumbsProvider>\n              <"+"RouteHeader />\n              <"+"Outlet />\n            <"+"/RouteHeaderCrumbsProvider>\n          ),\n          children: [\n            {\n              path: 'child',\n              element: <"+"RouteHeaderOverrideProbe />,\n              handle: { crumbs: [{ id: 'handle', label: 'Handle crumb' }] },\n            },\n          ],\n        },\n      ],\n      { initialEntries: ['/child'] },\n    );\n\n    render(<"+"RouterProvider router={router} />);\n\n    await waitFor(() => expect(screen.getByText('Override crumb')).toBeTruthy());\n    expect(screen.queryByText('Handle crumb')).toBeNull();\n  });\n});\n"},"src/bootstrap.test.ts":{"tests":[{"id":"7","name":"bootstrap preserves startup errors in the console before rendering the fallback"}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest';\n\nafterEach(() => {\n  vi.resetModules();\n  vi.doUnmock('./main');\n  vi.doUnmock('./startup-error');\n  vi.restoreAllMocks();\n});\n\ndescribe('bootstrap', () => {\n  it('preserves startup errors in the console before rendering the fallback', async () => {\n    const startupError = new Error('broken startup import');\n    const renderStartupError = vi.fn();\n    const consoleError = vi.spyOn(console, 'error').mockImplementation(() => {});\n\n    vi.doMock('./main', () => ({\n      startStudio: () => {\n        throw startupError;\n      },\n    }));\n    vi.doMock('./startup-error', () => ({ renderStartupError }));\n\n    await import('./bootstrap');\n\n    expect(consoleError).toHaveBeenCalledWith('Mastra Studio failed to start', startupError);\n    expect(renderStartupError).toHaveBeenCalledWith(startupError);\n  });\n});\n"},"src/domains/datasets/components/items/__tests__/dataset-items-layout.test.tsx":{"tests":[{"id":"8","name":"DatasetItemsLayout renders the list slot"},{"id":"9","name":"DatasetItemsLayout renders the detail panel with vertical spacing when provided"},{"id":"10","name":"DatasetItemsLayout shows the detail panel and suppresses the versions panel when both are present"},{"id":"11","name":"DatasetItemsLayout falls back to versions panel when there is no detail panel"},{"id":"12","name":"DatasetItemsLayout renders only the list when no side panel is requested"}],"source":"import { cleanup, render, screen } from '@testing-library/react';\nimport { afterEach, describe, expect, it } from 'vitest';\nimport { DatasetItemsLayout } from '../dataset-items-layout';\n\ndescribe('DatasetItemsLayout', () => {\n  afterEach(cleanup);\n\n  it('renders the list slot', () => {\n    render(<"+"DatasetItemsLayout listSlot={<"+"div data-testid=\"list\">list<"+"/div>} />);\n    expect(screen.getByTestId('list')).toBeDefined();\n  });\n\n  it('renders the detail panel with vertical spacing when provided', () => {\n    render(<"+"DatasetItemsLayout listSlot={<"+"div data-testid=\"list\" />} detailPanelSlot={<"+"div data-testid=\"detail\" />} />);\n\n    expect(screen.getByTestId('detail').parentElement?.classList.contains('py-3')).toBe(true);\n  });\n\n  it('shows the detail panel and suppresses the versions panel when both are present', () => {\n    render(\n      <"+"DatasetItemsLayout\n        listSlot={<"+"div />}\n        detailPanelSlot={<"+"div data-testid=\"detail\" />}\n        versionsPanelSlot={<"+"div data-testid=\"versions\" />}\n      />,\n    );\n    expect(screen.queryByTestId('detail')).not.toBeNull();\n    expect(screen.queryByTestId('versions')).toBeNull();\n  });\n\n  it('falls back to versions panel when there is no detail panel', () => {\n    render(<"+"DatasetItemsLayout listSlot={<"+"div />} versionsPanelSlot={<"+"div data-testid=\"versions\" />} />);\n    expect(screen.queryByTestId('versions')).not.toBeNull();\n  });\n\n  it('renders only the list when no side panel is requested', () => {\n    render(<"+"DatasetItemsLayout listSlot={<"+"div data-testid=\"list\" />} />);\n    expect(screen.queryByTestId('detail')).toBeNull();\n    expect(screen.queryByTestId('versions')).toBeNull();\n  });\n});\n"},"src/pages/traces/__tests__/traces-route.test.ts":{"tests":[{"id":"13","name":"traces routes when /traces is opened directly serves the traces list"},{"id":"14","name":"traces routes when a legacy /observability link is opened redirects to /traces and keeps its filters"}],"source":"import { createMemoryRouter } from 'react-router';\nimport { describe, expect, it } from 'vitest';\nimport { routes } from '@/App';\n\nasync function navigateTo(entry: string) {\n  const router = createMemoryRouter(routes, { initialEntries: [entry] });\n  await new Promise<"+"void>(resolve => {\n    if (router.state.initialized) return resolve();\n    const unsubscribe = router.subscribe(state => {\n      if (!state.initialized) return;\n      unsubscribe();\n      resolve();\n    });\n  });\n  return router;\n}\n\ndescribe('traces routes', () => {\n  describe('when /traces is opened directly', () => {\n    it('serves the traces list', async () => {\n      const router = await navigateTo('/traces');\n\n      expect(router.state.errors).toBeNull();\n      expect(router.state.matches.at(-1)?.route.path).toBe('/traces');\n    });\n  });\n\n  describe('when a legacy /observability link is opened', () => {\n    it('redirects to /traces and keeps its filters', async () => {\n      const router = await navigateTo('/observability?entity=weather');\n\n      expect(router.state.location.pathname).toBe('/traces');\n      expect(router.state.location.search).toBe('?entity=weather');\n    });\n  });\n});\n"}},"projectRoot":"/Users/mfrachet/.superset/worktrees/6a841b31-7df5-4ace-
