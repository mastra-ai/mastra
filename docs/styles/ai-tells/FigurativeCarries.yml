---
extends: existence
message: "AI overused verb: '%s'. Say what it contains or entails. Disable this rule for freight or logistics prose."
level: error
nonword: true
ignorecase: true
# "Carries" is an AI fingerprint for freighting an abstraction with unstated
# consequence: a term "carries baggage," a change "carries risk," an approach
# "carries a caveat." Literal carrying is everywhere (people carry bags,
# trucks carry freight), so the complement after the verb is the
# discriminator, in the FigurativeSits mold, for the verb-first tokens. The
# open-subject tokens flip the discriminator to a determiner-gated, pronoun,
# auxiliary, or code-span subject with the common literal carriers listed as
# exceptions, in the FigurativeLands mold; the exceptions below apply inside
# those tokens' spans, which is why each admits a word or two ahead of the
# subject. "Carries its
# weight" stays in AnthropomorphicJustification; the tokens here avoid that
# span so the two rules never double-flag. Freight or logistics writing
# disables the whole rule.
exceptions:
  # Vehicles and conveyances
  - "(?i)trucks?"
  - "(?i)bus(?:es)?"
  - "(?i)vans?"
  - "(?i)ships?"
  - "(?i)vessels?"
  - "(?i)boats?"
  - "(?i)trains?"
  - "(?i)ferr(?:y|ies)"
  - "(?i)planes?"
  - "(?i)aircraft"
  - "(?i)carts?"
  - "(?i)conveyors?"
  # People who carry
  - "(?i)couriers?"
  - "(?i)porters?"
  - "(?i)drivers?"
  - "(?i)soldiers?"
  - "(?i)players?"
  - "(?i)patients?"
  - "(?i)mothers?"
  - "(?i)fathers?"
  - "(?i)wom[ae]n"
  - "(?i)m[ae]n"
  - "(?i)person"
  - "(?i)people"
  # Biology and disease vectors
  - "(?i)virus(?:es)?"
  - "(?i)mosquito(?:es)?"
  - "(?i)ticks?"
  - "(?i)genes?"
  - "(?i)alleles?"
  - "(?i)chromosomes?"
  - "(?i)cells?"
  - "(?i)blood"
  - "(?i)proteins?"
  - "(?i)bacteria"
  - "(?i)carriers?"
  # Physical media
  - "(?i)wires?"
  - "(?i)cables?"
  - "(?i)currents?"
  - "(?i)winds?"
  - "(?i)rivers?"
  - "(?i)water"
  - "(?i)air"
  - "(?i)waves?"
  # Corpus-attested prose carriers: a cited paper, and Go's own Context
  # API, whose documentation says a Context carries deadlines and values.
  - "(?i)papers?"
  - "(?i)contexts?"
  - "(?i)objects?"
tokens:
  # --- Freighted significance: the abstraction hauls invisible cargo
  # ("carries weight in the review," "carries implications," "the term
  # carries baggage"). "Carries risk" is standard in medical and finance
  # registers; disable the rule for those files.
  - "\\bcarr(?:y|ies|ied|ying) (?:significant |real |extra |added |considerable |serious |enormous |heavy )?(?:weight|significance|meaning|implications?|connotations?|baggage|risks?|consequences|urgency|stigma)\\b"
  - "\\bcarr(?:y|ies|ied|ying) (?:the same|as much|more|less|little|no|equal|the|some) weight\\b"

  # --- Attached fine print: the change ships with a warning label
  # ("carries a caveat," "carries a cost," "carries a penalty"). The
  # sibling of the earning figure in FigurativeEarns, which flags what
  # the artifact earns rather than what it lugs around.
  - "\\bcarr(?:y|ies|ied|ying) (?:a|an|the) (?:caveat|warning|cost|price|price tag|penalty|footnote|asterisk|catch|downside|tradeoff|trade-off)\\b"

  # --- Heroics: one component drags the rest across the finish line
  # ("the cache carries the team," "one test carries the suite").
  - "\\bcarr(?:y|ies|ied|ying) the (?:day|team|torch|banner|mantle|load|conversation|narrative|argument|story|suite|whole \\w+)\\b"

  # --- Content possession: an inanimate component treated as a vessel that
  # hauls abstract cargo rather than one that contains or transmits it ("the
  # daemon carries no pipeline logic," "the module carries the validation
  # logic," "the packet carries the payload," "the signal carries data").
  # The transport framing is the tell in either domain, so the code-structure
  # nouns and the networking data nouns are both in the set. The "(?!out\\b)"
  # keeps the phrasal "carries out the logic" (execute) from matching, and
  # the head-noun set excludes physical objects, so literal "carries freight"
  # stays quiet. An optional determiner and one modifier word sit between the
  # verb and the head noun.
  - "\\bcarr(?:y|ies|ied|ying) (?!out\\b)(?:no |a |an |any |little |the |all the |its |their |extra |additional |significant |real |actual |meaningful |core )?(?:[a-z][-a-z]* )?(?:logic|functionality|behaviors?|behaviours?|semantics|side[ -]effects?|state|payloads?|data|traffic|tokens?|headers?|cookies?|signals?|metadata|information)\\b"

  # --- Rule possession: a file or section treated as the bearer of a policy
  # rather than the place the policy is written ("the lower block carries the
  # pattern for this case," "the config carries the exemption," "the schema
  # carries the constraint"). Distinct from the content-possession token
  # above, which frames the subject as a vessel hauling data; here the cargo
  # is a rule, and "contains" or "defines" is the word that was avoided. The head
  # nouns are policy and schema terms with no physical sense, so literal
  # freight ("the truck carries the load") cannot reach them. The lookahead
  # excludes both phrasal verbs that would otherwise slip through the
  # modifier slot: "carries out the policy" (execute) and "carried over
  # settings from the previous release" (bring forward).
  #
  # The known false positive is arithmetic writing, where "carry" means the
  # digit propagated to the next column rather than the verb of possession
  # ("carry the constraint" in a solver comment). Numeric and cryptographic
  # prose already disables this rule for the freight tokens above.
  - "\\bcarr(?:y|ies|ied|ying) (?!out\\b|over\\b)(?:no |a |an |any |the |its |their |that |this |the same |every )?(?:[a-z][-a-z]* )?(?:pattern|rule|exemption|exception|convention|constraint|requirement|policy|contract|guarantee|invariant|override|precedent|assumption|default|setting)s?\\b"

  # --- Typographic cargo: the freight is a mark on the page or in a name
  # ("carries a repotools: prefix," "none of the three carries a suffix,"
  # "the release carries a tag"). These head nouns leaked through the
  # policy-noun set above constantly in agent-written docs, which is what
  # put them here. "Annotation" is deliberately absent: Python's own
  # documentation says a function "may carry a return annotation," so that
  # noun floods. The rest measured zero across the Go and Python standard
  # libraries.
  - "\\bcarr(?:y|ies|ied|ying) (?!out\\b|over\\b)(?:no |a |an |any |the |its |their |that |this |every )?(?:[a-z][-a-z]* )?(?:prefix(?:es)?|suffix(?:es)?|tags?|labels?|markers?|trailers?|templates?|stamps?)\\b"

  # --- Negated cargo: the spec-sheet negation with the object left open
  # ("it carries no counts and no dates," "carries zero overhead").
  # NegatedObject leaves "carries no" to this rule, but the tokens above
  # gate on head-noun lists or on a determiner-fronted subject, so a
  # pronoun subject with an unlisted noun slipped past both. The corpora
  # show the open token once ("carry no data," which the content token
  # above flags on its own), so the object stays open, with
  # NegatedObject's own lookahead gates keeping degree idioms ("carries
  # no more than three") and literal counts ("carries zero or more")
  # quiet. The object slot matches NegatedObject's exactly, quoted and
  # backticked objects included: one quote mark may open the object, and
  # in markdown a backticked object becomes the asterisk run Vale's
  # parser masks the code span to, which is what the alternation matches
  # ("carries no `counts`"). Both spellings measure zero in the corpora,
  # like the bare one.
  - "\\bcarr(?:y|ies|ied|ying) (?:no (?!(?:one|matter|more|less|fewer|longer|sooner|later|earlier|better|worse|faster|slower|higher|lower|further|deeper|closer|harder|easier)\\b)|zero (?!(?:or|value|values|to)\\b))(?:['\"‘“`]?[a-z][-a-z]*\\b|\\*+)"

  # --- Mirrored possession: the same-construction sibling of FigurativeHolds
  # ("carries the same caveat," "carries a similar risk"). The comparison
  # word is the tell, so the object stays open.
  - "\\bcarr(?:y|ies|ied|ying) (?:the same|a similar|an identical|a matching)\\b"

  # --- Open-subject conveyance: any determiner-gated subject as the
  # bearer, with the complement left open ("the manifest carries the pin,"
  # "each zip carries its own README," "this distinction carries"). A
  # curated subject list proved unmaintainable here: agent prose attaches
  # this verb to an open-ended set of document and config nouns, so the
  # determiner and the inflected verb carry the discriminator between them,
  # in the widened-FigurativeSits mold, and the exceptions above name the
  # common literal carriers. The bare infinitive is left out because
  # arithmetic prose puts the carry noun in that slot ("the final carry,"
  # "the hardware carry"), the same collision that keeps it out of
  # CommitFigurativeVerbs; requiring a subject word between the determiner
  # and the verb also keeps the plural noun ("the carries are summed") from
  # matching. The lookahead excludes the phrasal "carries out," "carried
  # over," and "carried on." Rare literal carriers fire, so freight, biology,
  # or electrical writing disables the rule; the one known prose leak left
  # is journalism's conveyance sense ("the site carries the story"), which
  # media writing disables too.
  #
  # A second documentation audit (2026-09) found the subject slot too
  # narrow: the determiner list lacked "no," "one," "any," "some," and the
  # possessive ("no set carries the name," "Gravity's badge carries"), the
  # window took one modifier where agent prose writes two ("the virtual
  # config module carries the option"), an adverb between subject and verb
  # broke it ("an inline suppression always carries"), a hyphen, an
  # apostrophe, or a leading digit in a modifier did too ("a directory's
  # own page carries," "a 63-unit brand glyph carries"), the same hyphen
  # broke the modifier slot of the cargo tokens above ("carries a
  # per-illustration prefix"), and a code span in the subject ended the
  # match ("the `Match` comparison carries"), which the code-span token
  # below takes. Each opening measures
  # zero across the seven pre-LLM corpora except the two-modifier window,
  # which adds three: the plural noun ("the architecture has virtual
  # carries"), a gerund ("a little bit of carrying"), and a coordinated
  # verb ("a reverse butterfly and carries with it"). The preposition
  # lookahead refuses the gerund shape, and the contraction guard keeps
  # "it's not worth carrying" out of the possessive slot.
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|no|one|any|some|(?!(?:it|that|there|what|here|let)'s)[a-z]+'s) (?:[a-z0-9][-a-z0-9']* ){0,2}(?!(?:of|in|for|by|with|from|at|on|to|worth|without|while|when|before|after) )[a-z][-a-z']* (?:(?:already|also|always|never|still|then|now|only|just|otherwise|simply) )?carr(?:ies|ied|ying)(?!\\s+(?:out|over|on)\\b)\\b"

  # --- Pronoun subject: the bearer named by a pronoun, which no determiner
  # gate reaches ("no z-index it carries changes that," "this carries more
  # risk," "what carries the choice," "the ABI that carries through"). The
  # words ahead of the pronoun ride inside the span so the exceptions see
  # the antecedent when it is adjacent ("a Context that carries the task"
  # stays quiet on Go's own idiom). Fifteen corpus hits, nine of them
  # already reported by the head-noun tokens or dropped by the context
  # exception; the six that remain are the figure itself ("It carries
  # significant complexity," "it carries a dependency on the previous
  # store," "which carries the following notice").
  - "\\b(?:[a-z]+,? ){0,2}(?:it|which|that|what|who|this) (?:(?:already|also|always|never|still|then|now|only|just|otherwise|simply) )?carr(?:ies|ied|ying)(?!\\s+(?:out|over|on)\\b)\\b"

  # --- Code-span subject: an identifier as the bearer ("`Icon` carries its
  # own box," "the `Match` comparison carries the option," "`caution`
  # carries a dedicated ink"). Vale's markdown parser masks the span to an
  # asterisk run, and an alert whose span runs through that run is dropped
  # without a report, so the run and the words after it sit in a lookbehind
  # and the reported match is the verb alone. The subject windows above
  # refuse the run for the same reason: a match that consumed it would be
  # dropped and take the verb with it, leaving nothing for the verb-first
  # tokens. An identifier cannot carry anything literally, and the corpora
  # are plain text with no masking, so the shape measures nothing there.
  - "(?<=\\*+ (?:[a-z][-a-z']* ){0,2})carr(?:ies|ied|ying)(?!\\s+(?:out|over|on)\\b)\\b"
  - "(?<=\\*+ (?:[a-z][-a-z']* ){0,2})carry\\b(?! (?:out|over|on|if|when|bits?|flags?|chains?|in|save|propagation|lookahead|select)\\b|[.,;:)/])"

  # --- Auxiliary before the bare verb: a modal, an infinitive marker, or a
  # negated "do" proves "carry" is the verb where the arithmetic noun could
  # otherwise sit ("the file has to carry the scope," "pages will not carry
  # the control," "the badge can carry a leading icon," "comments the target
  # didn't carry before"). The audit found this the largest family the rule
  # missed, fifteen hits in one documentation tree. Thirty-two corpus hits,
  # six already reported by the head-noun tokens ("to carry request-scoped
  # data," "would carry the constraint"); the rest are human prose using the
  # figure ("does not carry a Go type," "this break can carry a value,"
  # "has to carry extra complexity"), which stays and is flagged. The
  # arithmetic verb shows twice, clause-final after the infinitive marker
  # ("copy high bit to carry.") and coordinated with a register name ("to
  # carry and carryAlt"), and the lookahead refuses both, along with "carry
  # its weight," which stays in AnthropomorphicJustification. A modal ahead
  # of a clause-final "carry" measures one corpus hit, the figure ("the
  # values they can carry."), so only the infinitive takes the punctuation
  # refusal, and "the names the dictionaries don't carry, plus" reports. The
  # words ahead of the auxiliary ride inside the span for the exceptions
  # ("the truck can carry" stays quiet).
  - "\\b(?:[a-z]+ ){0,2}(?:(?:can|cannot|can't|could|may|might|must|shall|should|will|won't|would|do|does|did|don't|doesn't|didn't|not|never) carry\\b(?![- ]out\\b| (?:over|on|if|when|bits?|flags?|chains?|in|save|propagation|lookahead|select)\\b| and carry| (?:its|their) (?:own )?weight\\b)|to carry\\b(?![- ]out\\b| (?:over|on|if|when|bits?|flags?|chains?|in|save|propagation|lookahead|select)\\b| and carry| (?:its|their) (?:own )?weight\\b|[.,;:)/]))"

  # --- The bare "carry" the tokens above leave out, admitted where a
  # plural subject or a relative pronoun proves it is the verb ("the
  # machine formats carry the score columns," "the blobs that carry no
  # state rows," "the tier other stages carry"). A documentation-corpus
  # audit (2026-09) found the plural-subject construction escaping every token
  # here, the verb being the one writers reach for once a reviewer has
  # taken "holds" away. The determiner-gated plural measures one corpus
  # hit ("These embedded types carry methods with them"), the
  # relative-pronoun token two, both the arithmetic verb ("which will
  # carry if src != 0"), which the trailing lookahead now refuses along
  # with the phrasal forms. The second audit widened the determiner list,
  # the modifier window, and the adverb slot to match the inflected token
  # ("the names already carry," "Today's assets carry only two forms") and
  # added the plural pronouns to the relative token ("These carry offsets"),
  # each at zero corpus cost.
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|most|some|many|two|three|several|other|no|one|any|(?!(?:it|that|there|what|here|let)'s)[a-z]+'s) (?:[a-z0-9][-a-z0-9']* ){0,2}[a-z]+s (?:(?:already|also|always|never|still|then|now|only|just|otherwise|simply) )?carry\\b(?! (?:out|over|on|if|when|bits?|flags?|chains?|in|save|propagation|lookahead|select)\\b)"
  - "\\b(?:that|which|who|what|they|these|those|both) (?:[a-z]+ )?carry\\b(?! (?:out|over|on|if|when|bits?|flags?|chains?|in|save|propagation|lookahead|select)\\b|[.,;:)/])"

  # --- The bare plural with no determiner, which the token above kept out
  # over the arithmetic noun ("returns the carry," "output 0 is
  # carry/borrow"). The audit found it seven times ("Expanded forms carry a
  # negation," "pages carry a control," "Python scripts carry inline
  # metadata"), so it comes in with the noun's own shapes refused: the
  # copula and the demonstrative ahead of the noun ("is carry," "this
  # carry") by a lookahead on the subject word, and the slash or the
  # clause-final punctuation after it by the trailing one. The plural subject
  # measures eight corpus hits, five of them the determiner-gated shape the
  # token above already reports; the three that remain are the figure
  # ("object types carry a single lifetime bound," "Defaults always carry
  # some potential to surprise") and a clause-final relative the lookahead
  # refuses.
  - "\\b(?!(?:this|is|was|has|as|does|thus|its|his|us|plus|minus|yes)\\b)[a-z]+s (?:(?:already|also|always|never|still|then|now|only|just|otherwise|simply) )?carry\\b(?! (?:out|over|on|if|when|bits?|flags?|chains?|in|save|propagation|lookahead|select)\\b|[.,;:)/])"
