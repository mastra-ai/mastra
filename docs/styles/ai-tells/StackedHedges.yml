---
extends: existence
# A modal verb followed by an epistemic adverb: "could potentially," "may
# possibly," "might conceivably." The modal already carries the uncertainty;
# the adverb restates it. Modal-first order only: the reversed "possibly
# could" is idiomatic in "she did all she possibly could" and stays clean.
# Single hedges belong to no rule; this flags only the stack.
message: "AI stacked hedge: '%s'. Drop one hedge, or give a number instead."
level: error
ignorecase: true
tokens:
  - could potentially
  - can potentially
  - may potentially
  - might potentially
  - could possibly
  - can possibly
  - may possibly
  - might possibly
  - could perhaps
  - may perhaps
  - might perhaps
  - could conceivably
  - may conceivably
  - might conceivably
