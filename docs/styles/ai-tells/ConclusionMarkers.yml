---
extends: existence
message: "AI conclusion: '%s'. Delete this and end on your final point."
level: error
ignorecase: true
tokens:
  - In conclusion
  - In summary
  - To summarize
  - To sum up
  - To conclude
  - In closing
  # Bare adverbs only as sentence-initial discourse markers with a trailing
  # comma; the mid-sentence adjective/adverb senses ("overall design",
  # "ultimately responsible") are not the closer tell.
  - '^Ultimately(?=,)'
  - All in all
  - At the end of the day
  - When all is said and done
  - The bottom line is
  - In the final analysis
  - Taking everything into account
  - Taking all of this into account
  - '^Overall(?=,)'
  - On the whole
  - By way of conclusion
