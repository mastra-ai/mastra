extends: existence
message: "Avoid language that assumes proficiency level ('%s'). It can alienate learners."
level: error
ignorecase: true
tokens:
  - '\beasy\b'
  - '\beasily\b'
  - '\bsimple\b'
  - '\bsimply\b'
  - '\bjust\b'
  - '\bstraightforward\b'
  - '\bobviously\b'
  - '\btrivial\b'
  - everyone knows
  - common sense
  - common knowledge
