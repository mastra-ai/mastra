extends: capitalization
message: "Use sentence-case for headings: '%s'."
level: error
scope: heading
match: $sentence
indicators:
  - ':'
# Vale builds an "expected" heading by re-joining its words, which drops
# hyphens, colons and apostrophes, so a heading that is already sentence case
# still fails on any word containing one ("In-process isolation",
# "What's in the cache key"). That only happens when the rule inherits the
# project Vocab, so `vocab` is off and the words it supplied are listed
# below. The `(?i)` prefixes stay off on purpose: case-insensitive entries
# leak to the rest of the expression, where a short one like "ID" then
# excuses every word that contains it. The list starts from
# styles/config/vocabularies/Mastra/accept.txt and then adds product and
# standard names that only appear capitalized in headings, so those do not
# have to be enforced in prose.
vocab: false
exceptions:
  # Identifiers and punctuation that keep their spelling.
  - '[A-Z][a-z]+(?:[A-Z][a-z]+)+'
  - '[a-z]+[A-Z][a-zA-Z]*'
  - '[a-zA-Z]*\.[a-zA-Z]+(?:\(\))?'
  - '[a-zA-Z]+\(\)'
  # Headings that name a config key, method, or event stay lowercase.
  - '^[a-z][a-z0-9.-]*$'
  - 'macOS'
  - '[A-Z][a-z]+-[a-z]+-[A-Za-z]+'
  - '[A-Z][a-z]+-[a-z]+'
  - '[A-Z][A-Z_]+'
