extends: existence
message: "'%s' is a weasel word!"
ignorecase: true
level: warning
# Frequency and quantity words from the upstream rule (`several`, `usually`,
# `mostly`, `various`, `substantially`, `relatively`, `significantly`,
# `largely`, `fairly`) are intentionally omitted. In technical docs they
# describe real behavior or frequency, and replacing them either loses
# information or invents false precision. write-good 1.0.8 added `few` and
# `many`, which are left out for the same reason.
tokens:
  - clearly
  - completely
  - exceedingly
  - excellent
  - extremely
  - huge
  - interestingly
  - are a number
  - is a number
  - obviously
  - quite
  - remarkably
  - surprisingly
  - tiny
  - vast
  - very
