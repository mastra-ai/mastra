StylesPath = styles

MinAlertLevel = suggestion

Vocab = Mastra

# Packages (synced with `vale sync`)
Packages = write-good, ai-tells

# Generated pages whose prose comes from elsewhere. Fix findings at the source, not here.
# - *.api.mdx: Gateway API reference, generated from the Gateway OpenAPI document.
# - connect/providers.mdx: tool descriptions from @mastra/connect toolset metadata.
# Patterns start with ** so they also match from the repo-root .vale-ci.ini that CI uses.
IgnoredPaths = **/*.api.mdx, **/src/content/en/reference/connect/providers.mdx

# Lint English content and the docs synced to external sites (excluding auto-generated models)
# Native MDX support
[**/src/{content/en/{docs,guides,reference,integrations},mastra-code,agent-builder,factory}/**/*.{md,mdx}]
BasedOnStyles = Vale, write-good, write-good-overrides, Mastra, signs-of-ai-writing, ai-tells, ai-tells-overrides

# Disabled rules. Each comment gives the reason, so a `NO` here never reads as
# a rule silenced to get a build through. Counts are what the rule would flag
# across the docs as of November 2026.

# Technical writing needs "is" and "are" to define things (10,800 hits).
write-good.E-Prime = NO
# Passive voice is often right in reference docs: "the token is validated" (5,100 hits).
write-good.Passive = NO
# Flags plain technical verbs like "modify", "satisfy", and "authorize" (1,400 hits).
write-good.TooWordy = NO

# Narrower, project-owned replacement lives in styles/write-good-overrides.
write-good.Weasel = NO
# Duplicates Mastra.Adverbs, which carries our tuned word list (2,500 hits).
write-good.Adverbs = NO
# The 1.0.8 rule treats every line start as a sentence start, so it flags wrapped
# lines that begin with "so" and domains like latitude.so. All 3 hits were false.
write-good.So = NO

# Disabled with the original ai-tells setup (#19494) as too broad for technical prose.
# ColonUsage wants a lowercase word after a colon, but house style capitalizes it
# in headings and labels (2,300 hits). FormalRegister flags "implement" (430).
# FormalTransitions flags "for example" (530). AnnouncementHeadings matches nothing
# today.
ai-tells.AnnouncementHeadings = NO
ai-tells.ColonUsage = NO
ai-tells.FormalRegister = NO
ai-tells.FormalTransitions = NO

# Disabled while tuning rules for technical prose (#23415). Each one flags normal
# API description: "holds the parsed value", "names the field", "a single
# instance", "the response shape", "owns the agent loop", and noun stacks like
# "Slack app configuration tokens" (between 2 and 510 hits each).
# FigurativeDisguises matches nothing today.
ai-tells.BareHolds = NO
ai-tells.BareNames = NO
ai-tells.FigurativeDisguises = NO
ai-tells.FigurativeOwns = NO
ai-tells.NamedAdjective = NO
ai-tells.FillerIntensifier = NO
ai-tells.NounString = NO
ai-tells.FigurativeShape = NO

# These rules flag ordinary technical language or grammatical constructions.
ai-tells.FigurativeStays = NO
ai-tells.FigurativeKeeps = NO
ai-tells.FigurativeFires = NO
ai-tells.FigurativeSurfaces = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeTravels = NO
ai-tells.MortalityMetaphors = NO
ai-tells.VerbTricolon = NO
ai-tells.ConsequenceParticiple = NO
ai-tells.CoordinatedReveal = NO
ai-tells.StrawmanContrast = NO
ai-tells.NegatedPair = NO
ai-tells.AnthropomorphicAdjectives = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO
ai-tells.BareReaches = NO
ai-tells.AnthropomorphicCognition = NO
ai-tells.UniversalSubject = NO
ai-tells.UniversalObject = NO

# Narrower, project-owned replacements live in styles/ai-tells-overrides.
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeWins = NO
ai-tells.FigurativeFalls = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeNouns = NO
ai-tells.FigurativeIdioms = NO
ai-tells.MotionMetaphors = NO
ai-tells.EnforcementMetaphors = NO
ai-tells.EvasionMetaphors = NO
ai-tells.ExplainerHeadings = NO
ai-tells.ExplainerLeads = NO
ai-tells.ShellNounCopula = NO
ai-tells.RestatementMarkers = NO
ai-tells.StackedAnaphora = NO
ai-tells.OverusedVocabulary = NO

# Product names and code identifiers would need a large, separately maintained
# allowlist before spell checking is useful here.
Vale.Spelling = NO

# Example prompts and product copy that quote the reader's own words.
[**/src/content/en/{reference/build-with-ai.mdx,reference/manual-install.mdx,reference/evals/noise-sensitivity.mdx,integrations/frameworks/next-js.mdx}]
Mastra.AvoidFirstPerson = NO

# Quotes a user asking "What did we decide about the refund?".
[**/src/content/en/docs/memory/semantic-recall.mdx]
Mastra.AvoidWeUs = NO

# "Simple Auth" is the name of a Mastra auth provider.
[**/src/content/en/{docs/auth/simple-auth.mdx,docs/auth/overview.mdx,docs/license.mdx,docs/studio/auth.mdx}]
Mastra.AvoidProficiency = NO

# `browser_click` and the browser tools act on a page; "select" would be inaccurate.
[**/src/content/en/reference/browser/agent-browser.mdx]
Mastra.AvoidClick = NO

# Customer messages, example instructions, and FAQ questions written in the reader's voice.
[**/src/content/en/{docs/guides/build-an-eval-loop.mdx,integrations/browsers/stagehand.mdx,**/_partial-quickstart-prompt.mdx,docs/mastra-platform/deploy/overview.mdx,docs/mastra-platform/gateway/overview.mdx}]
Mastra.AvoidFirstPerson = NO

# "Slowly Changing Dimension Type 2" is the formal term for the versioning model.
[**/src/content/en/{docs/evals/datasets.mdx,reference/datasets/getItemHistory.mdx,reference/datasets/purgeItem.mdx}]
Mastra.Adverbs = NO

# Task-complexity labels ("Simple tasks", "Non-trivial tasks") describe the
# work, not the reader's skill level.
[**/src/mastra-code/modes.mdx]
Mastra.AvoidProficiency = NO
