StylesPath = styles

MinAlertLevel = suggestion

Vocab = Mastra

# Packages (synced with `vale sync`)
Packages = write-good, ai-tells

# Only lint English content (excluding auto-generated models)
# Native MDX support
[**/src/content/en/{docs,guides,reference}/**/*.{md,mdx}]
BasedOnStyles = Vale, write-good, Mastra, signs-of-ai-writing, ai-tells, ai-tells-overrides

# Disable rules
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
ai-tells.AnnouncementHeadings = NO
ai-tells.ColonUsage = NO
ai-tells.FormalRegister = NO
ai-tells.FormalTransitions = NO
ai-tells.BareHolds = NO
ai-tells.BareNames = NO
ai-tells.FigurativeDisguises = NO
ai-tells.FigurativeOwns = NO
ai-tells.NamedAdjective = NO
ai-tells.FillerIntensifier = NO
ai-tells.NounString = NO
ai-tells.FigurativeShape = NO

# These rules flag ordinary technical language or grammatical constructions.
ai-tells.FigurativeStays = NO
ai-tells.FigurativeKeeps = NO
ai-tells.FigurativeFires = NO
ai-tells.FigurativeSurfaces = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeTravels = NO
ai-tells.MortalityMetaphors = NO
ai-tells.VerbTricolon = NO
ai-tells.ConsequenceParticiple = NO
ai-tells.CoordinatedReveal = NO
ai-tells.StrawmanContrast = NO
ai-tells.NegatedPair = NO
ai-tells.AnthropomorphicAdjectives = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO
ai-tells.BareReaches = NO
ai-tells.AnthropomorphicCognition = NO
ai-tells.UniversalSubject = NO
ai-tells.UniversalObject = NO

# Narrower, project-owned replacements live in styles/ai-tells-overrides.
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeWins = NO
ai-tells.FigurativeFalls = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeNouns = NO
ai-tells.FigurativeIdioms = NO
ai-tells.MotionMetaphors = NO
ai-tells.EnforcementMetaphors = NO
ai-tells.EvasionMetaphors = NO
ai-tells.ExplainerHeadings = NO
ai-tells.ExplainerLeads = NO
ai-tells.ShellNounCopula = NO
ai-tells.RestatementMarkers = NO
ai-tells.StackedAnaphora = NO

# Disable Spelling check, potentially enable in the future with a custom dictionary in accept.txt
Vale.Spelling = NO
