# Local PostgreSQL (with pgvector) for the Factory Server.
#
# Usage:
#   npm run db:up
#   DATABASE_URL=postgres://factory:factory@localhost:54330/factory
#   npm run db:down
services:
  db:
    image: pgvector/pgvector:pg18
    ports:
      - '127.0.0.1:54330:5432'
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes:
      # postgres:18+ images require the mount at /var/lib/postgresql.
      - factory-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d factory']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  factory-pgdata:
