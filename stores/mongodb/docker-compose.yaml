services:
  mongodb-storage:
    # Pinned to 7.x: MongoDB 8.x fatally refuses to start on Linux kernel 6.19+
    # (TCMalloc rseq incompatibility, SERVER-121912), which is what the CI runner
    # fleet runs. Do not bump back to 8.x until MongoDB ships a patched TCMalloc.
    image: mongo:7.0.37
    container_name: 'mongodb-storage-test-db'
    ports:
      - '27017:27017'
    volumes:
      # v7 suffix: mongod 7.x cannot open a data dir created by 8.x, so reusing
      # the old `mongodbdata` volume would fail on machines that ran 8.3.4.
      - mongodbdata-v7:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
  mongodb-vector:
    # Pinned to 8.2: $rankFusion (used by hybridQuery) requires MongoDB >= 8.1.
    #
    # Automated Embedding needs the `preview` image, which bundles the Community mongot
    # build, and a Voyage API key. To run those tests, set both in stores/mongodb/.env and
    # opt in with TEST_MONGODB_AUTOEMBEDDING=1:
    #   ATLAS_LOCAL_TAG=preview
    #   VOYAGE_API_KEY=<key>
    # https://hub.docker.com/r/mongodb/mongodb-atlas-local#current-experimental-features
    image: mongodb/mongodb-atlas-local:${ATLAS_LOCAL_TAG:-8.2}
    container_name: 'mongodb-vector-test-db'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: mongodb
      MONGODB_INITDB_ROOT_PASSWORD: mongodb
      # Consumed by mongot in the preview image; ignored by the pinned tag. The key must be
      # provisioned through the Atlas UI — a key issued by Voyage AI directly is rejected by
      # the default https://ai.mongodb.com/v1/embeddings endpoint.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - 27018:27017
    healthcheck:
      test: ['CMD', 'mongosh', '-u', 'mongodb', '-p', 'mongodb', '--eval', "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
volumes:
  mongodbdata-v7:
