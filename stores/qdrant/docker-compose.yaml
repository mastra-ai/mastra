services:
  qdrant:
    # Pinned: v1.19.1 changed full-text (MatchText) behavior on unindexed fields,
    # breaking substring-style $regex filter tests. Bump deliberately after verifying.
    image: qdrant/qdrant:v1.19.0
    ports:
      - '6333:6333' # REST API port
      - '6334:6334' # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_LOG_LEVEL=INFO
    restart: always

volumes:
  qdrant_data:
    driver: local
