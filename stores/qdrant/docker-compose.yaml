services:
  qdrant:
    # Pinned so upstream releases can't break CI for every PR at once.
    # Bump deliberately after running the test suite against the new version.
    image: qdrant/qdrant:v1.19.1
    ports:
      - '6333:6333' # REST API port
      - '6334:6334' # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_LOG_LEVEL=INFO
    restart: always

volumes:
  qdrant_data:
    driver: local
