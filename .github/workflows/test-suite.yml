name: Prebuild Tests

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      has_code:
        required: true
        type: string
      has_unit_tests:
        required: false
        type: string
        default: 'false'
      # JSON array of shard numbers from "Plan unit test shards" in prebuild.yml.
      unit_shards:
        required: false
        type: string
        default: '[]'
      e2e_test_files:
        required: false
        type: string
        default: ''
      run_full:
        required: false
        type: string
        default: 'true'
      durable_streams_changed:
        required: false
        type: string
        default: 'false'
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

permissions: {}

jobs:
  unit-test:
    name: UNIT Test (Shard ${{ matrix.shard }})
    if: inputs.has_code == 'true' && inputs.run_full != 'false'
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 2

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm turbo build --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*"

      - name: Run changed tests (Shard ${{ matrix.shard }}/8)
        run: |
          pnpm vitest run \
            --project 'unit:*' --project 'typecheck:*' \
            --reporter=blob \
            --reporter=verbose \
            --reporter=github-actions \
            --outputFile.blob=.vitest-reports/blob-unit-${{ matrix.shard }}.json \
            --shard=${{ matrix.shard }}/8 \
            --passWithNoTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-blob-unit-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  affected-unit-test:
    name: Affected UNIT Test${{ strategy.job-total > 1 && format(' ({0}/{1})', matrix.shard, strategy.job-total) || '' }}
    if: inputs.has_code == 'true' && inputs.run_full == 'false' && inputs.has_unit_tests == 'true' && inputs.unit_shards != '[]'
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.unit_shards) }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 2

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm turbo build --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*"

      - name: Download affected tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: affected-tests-outputs
          path: /tmp/affected-outputs

      - name: Run affected tests
        # One vitest run for the shard's whole list. xargs would split a long list into several
        # runs that overwrite each other's blob report.
        run: |
          # Start the slowest files first (scripts/vitest-slow-first-sequencer.ts), when timings exist.
          if [ -f /tmp/affected-outputs/test-timings.json ]; then
            export VITEST_SLOW_FIRST_TIMINGS=/tmp/affected-outputs/test-timings.json
          fi
          mapfile -t test_files < /tmp/affected-outputs/shards/shard-${{ matrix.shard }}.txt
          pnpm vitest run \
            --project 'unit:*' --project 'typecheck:*' \
            --reporter=blob \
            --reporter=verbose \
            --reporter=github-actions \
            --outputFile.blob=.vitest-reports/blob-unit-affected-${{ matrix.shard }}.json \
            --passWithNoTests \
            "${test_files[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-blob-unit-affected-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  e2e-test:
    name: E2E Test (${{ matrix.project }})
    if: inputs.has_code == 'true' && (inputs.run_full != 'false' || inputs.e2e_test_files != '')
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - packages/*
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 2
          ref: ${{ inputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm turbo build --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*"
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Normalize project name
        id: normalize
        run: echo "project_id=$(echo '${{ matrix.project }}' | tr '/' '-' | sed 's/\*/_star_/g')" >> $GITHUB_OUTPUT

      - name: Run changed tests (${{ matrix.project }})
        env:
          E2E_TEST_FILES: ${{ inputs.e2e_test_files }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          if [ "${{ inputs.run_full }}" = "false" ]; then
            printf '%s\n' "$E2E_TEST_FILES" > /tmp/affected-e2e.txt
            TEST_ARGS=$(cat /tmp/affected-e2e.txt | tr '\n' ' ')
          else
            TEST_ARGS=""
          fi

          pnpm vitest run \
            $TEST_ARGS \
            --project 'e2e:${{ matrix.project }}' \
            --reporter=blob \
            --reporter=verbose \
            --reporter=github-actions \
            --outputFile.blob=.vitest-reports/blob-e2e-${{ steps.normalize.outputs.project_id }}.json \
            --passWithNoTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-blob-e2e-${{ steps.normalize.outputs.project_id }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # Durable takeover runs against real Redis and Postgres. It reports as its own check and is
  # deliberately kept out of merge-reports: it is a multi-process SIGTERM/SIGKILL suite whose
  # flake rate has not been measured, so a red run must not block a merge.
  durable-streams:
    name: Durable Stream Tests
    if: inputs.has_code == 'true' && inputs.durable_streams_changed == 'true'
    uses: ./.github/workflows/test-durable-streams.yml
    permissions:
      contents: read
    with:
      head_sha: ${{ inputs.head_sha }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # The required check. It only reads the test jobs' results, so it finishes seconds after the
  # last shard instead of checking out and installing the repo to merge reports first. The
  # merged report is "Test Report" below, which no merge waits for.
  merge-reports:
    name: Merge Test Reports
    runs-on: starsling-ubuntu-26.04-2
    needs: [unit-test, affected-unit-test, e2e-test]
    # Required check: stays always() so a run cancelled mid-tests still fails here. A skipped
    # required job counts as a pass.
    if: always()
    permissions: {}
    steps:
      # A test job that failed or was cancelled would otherwise leave this required check green.
      - name: Require every test job to finish
        env:
          UNIT: ${{ needs.unit-test.result }}
          AFFECTED_UNIT: ${{ needs.affected-unit-test.result }}
          E2E: ${{ needs.e2e-test.result }}
          # Affected unit tests were selected, so their shards must have run.
          EXPECT_AFFECTED: ${{ inputs.has_code == 'true' && inputs.run_full == 'false' && inputs.has_unit_tests == 'true' }}
        run: |
          status=0
          for job in UNIT AFFECTED_UNIT E2E; do
            result="${!job}"
            echo "$job: $result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$job test job ended with '$result'; its tests did not all run."
              status=1
            fi
          done
          if [ "$EXPECT_AFFECTED" = "true" ] && [ "$AFFECTED_UNIT" != "success" ]; then
            echo "::error::Affected unit tests were selected but no shard ran them."
            status=1
          fi
          exit $status

  # Merges the shards' reports into one summary. On a full-suite run it also records how long
  # each test file took, which "Plan unit test shards" in prebuild.yml balances shards with.
  # Only runs on main (the alpha cron) can seed it: a PR's cache is visible to that PR alone.
  test-report:
    name: Test Report
    runs-on: starsling-ubuntu-26.04
    needs: [unit-test, affected-unit-test, e2e-test]
    if: ${{ !cancelled() && inputs.has_code == 'true' && (inputs.run_full != 'false' || inputs.has_unit_tests == 'true' || inputs.e2e_test_files != '') }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 1
          ref: ${{ inputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports
        run: |
          pnpm vitest --merge-reports=.vitest-reports \
            --reporter=default --reporter=github-actions \
            --reporter=json --outputFile.json=.vitest-reports/merged.json \
            --passWithNoTests

      - name: Record unit test timings
        if: ${{ !cancelled() && inputs.run_full != 'false' }}
        run: node .github/scripts/test-timings.cjs .vitest-reports/merged.json "$RUNNER_TEMP/test-timings.json"

      - name: Save unit test timings
        if: ${{ !cancelled() && inputs.run_full != 'false' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/test-timings.json
          key: test-timings-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
