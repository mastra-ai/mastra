name: Prebuild

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, 0.x]
  # Lets other workflows (e.g. the alpha cron, which publishes without a PR) gate on the
  # full suite without duplicating these jobs. A call always runs the full suite on the
  # caller's commit.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect code changes
    runs-on: starsling-ubuntu-26.04-2
    permissions:
      contents: read
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
      head_sha: ${{ steps.filter.outputs.head_sha }}
      full_suite: ${{ steps.filter.outputs.full_suite }}
    steps:
      - name: Checkout repo
        if: github.event_name == 'pull_request'
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Check for code changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # A workflow_call (e.g. the alpha cron) and the Changesets release PR run the full
          # suite. Other PRs start with affected tests; shared lint migrations select the full
          # suite below. A fork can pick any branch name, so the release PR head must also
          # live in this repository.
          FULL_SUITE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/')) }}
        run: |
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "full_suite=$FULL_SUITE" >> "$GITHUB_OUTPUT"

          if [ "$FULL_SUITE" = "true" ]; then
            echo "Full suite requested; running Prebuild."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "Could not diff the PR; running affected tests fail-closed."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_files=$(printf '%s\n' "$changed_files" \
            | grep -vE '^(docs/|examples/|\.changeset/|explorations/)' \
            | grep -v '^$' || true)

          # Shared lint migrations can touch every package; use the existing test shards.
          if grep -Fxq 'oxlint.config.ts' <<< "$changed_files"; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$code_files" ]; then
            echo "Code changes found; running affected tests."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, examples, changesets or explorations changed; skipping Prebuild."
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  prebuild:
    name: Build
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 20
    if: needs.changes.outputs.has_code == 'true' && github.repository == 'mastra-ai/mastra'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          fetch-depth: 2

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm turbo --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*" build

  affected-tests:
    name: Detect affected tests
    needs: changes
    if: github.repository == 'mastra-ai/mastra' && needs.changes.outputs.has_code == 'true'
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_full: ${{ steps.compute.outputs.run_full }}
      has_unit_tests: ${{ steps.compute.outputs.has_unit_tests }}
      e2e_test_files: ${{ steps.compute.outputs.e2e_test_files }}
      e2e_changed: ${{ steps.compute.outputs.e2e_changed }}
      experiment_worker_e2e_changed: ${{ steps.compute.outputs.experiment_worker_e2e_changed }}
      mastracode_e2e_changed: ${{ steps.compute.outputs.mastracode_e2e_changed }}
      stores_changed: ${{ steps.compute.outputs.stores_changed }}
      workspaces_changed: ${{ steps.compute.outputs.workspaces_changed }}
      memory_changed: ${{ steps.compute.outputs.memory_changed }}
      affected_store_tests: ${{ steps.compute.outputs.affected_store_tests }}
      affected_workspace_tests: ${{ steps.compute.outputs.affected_workspace_tests }}
      workspace_packages: ${{ steps.compute.outputs.workspace_packages }}
      workspace_docker_packages: ${{ steps.compute.outputs.workspace_docker_packages }}
      affected_memory_tests: ${{ steps.compute.outputs.affected_memory_tests }}
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: false

      - name: Install affected-test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter mastra-turbo

      - name: Compute affected test files
        id: compute
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
        run: |
          # The full suite ignores the diff, and a workflow_call has no PR base to diff against.
          if [ "$FULL_SUITE" = "true" ]; then
            : > /tmp/changed-files.txt
          else
            git diff --name-only \
              "$BASE_SHA...$HEAD_SHA" \
              > /tmp/changed-files.txt
          fi

          CHANGED=$(grep -E '/src/.*\.(ts|tsx)$' /tmp/changed-files.txt \
            | grep -vE '__fixtures__|/fixtures/' \
            || true)

          if [ -z "$CHANGED" ]; then
            echo "No source file changes found — skipping unit and E2E test selection."
            printf '{"affectedTests":[],"count":0,"testFiles":1}\n' > /tmp/affected.json
          else
            echo "Changed source files:"
            echo "$CHANGED"

            # Run affected-tests tool
            echo "$CHANGED" | xargs node scripts/affected-tests.mjs --json > /tmp/affected.json
          fi

          # Parse results, split unit/E2E files, and compute downstream gates.
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/affected.json', 'utf-8'));
          const changedFiles = fs.readFileSync('/tmp/changed-files.txt', 'utf-8').split(/\r?\n/).filter(Boolean);
          const nonMarkdownChangedFiles = changedFiles.filter(file => !file.endsWith('.md'));
          const affectedTests = (data.affectedTests || []).sort();
          const count = data.count || 0;
          const total = data.testFiles || 1;
          const ratio = count / total;
          // Only the release PR and workflow calls run the full suite. A regular PR runs its
          // affected tests, however many there are.
          const fullSuite = process.env.FULL_SUITE === 'true';
          const runFull = fullSuite;

          const output = (line) => fs.appendFileSync(process.env.GITHUB_OUTPUT, line);
          const outputList = (name, files) => {
            output(`${name}<<AFFECTED_EOF\n`);
            output(`${files.join('\n')}${files.length > 0 ? '\n' : ''}`);
            output('AFFECTED_EOF\n');
          };
          const changed = (predicate) => nonMarkdownChangedFiles.some(predicate);
          const affected = (predicate) => affectedTests.some(predicate);

          const isPackageE2eTest = (file) => file.startsWith('packages/') && (
            file.includes('.e2e.') ||
            file.startsWith('packages/evals/src/scorers/llm/') ||
            file.startsWith('packages/rag/src/')
          );
          const isExternalE2eTest = (file) =>
            file.startsWith('e2e-tests/') || file.startsWith('packages/playground/e2e/');
          const unitTestFiles = affectedTests.filter(file => !isPackageE2eTest(file) && !isExternalE2eTest(file));
          const e2eTestFiles = affectedTests.filter(isPackageE2eTest);

          fs.mkdirSync('/tmp/affected-outputs', { recursive: true });
          fs.writeFileSync(
            '/tmp/affected-outputs/unit_test_files.txt',
            `${unitTestFiles.join('\n')}${unitTestFiles.length > 0 ? '\n' : ''}`,
          );

          const affectedStoreTests = affected(file => file.startsWith('stores/'));
          const affectedWorkspaceTests = affected(file => file.startsWith('workspaces/'));
          const affectedMemoryTests = affected(file => file.startsWith('packages/memory/integration-tests/'));
          const {
            discoverWorkspacePackages,
            selectWorkspacePackages,
          } = require('./.github/scripts/ci-routing.cjs');
          const workspaceSelection = selectWorkspacePackages({
            affectedTests,
            changedFiles,
            runFull,
            workspacePackages: discoverWorkspacePackages(),
          });

          const storesChanged = fullSuite || affectedStoreTests || changed(file =>
            file.startsWith('stores/') ||
            file === '.github/workflows/test-combined-stores.yml' ||
            file === '.github/workflows/prebuild.yml'
          );
          const workspacesChanged = workspaceSelection.packages.length > 0;
          const memoryChanged = fullSuite || affectedMemoryTests || changed(file =>
            file.startsWith('packages/memory/') || file === '.github/workflows/prebuild.yml'
          );
          const { studioE2eChanged } = require('./.github/scripts/studio-e2e-routing.cjs');
          const e2eChanged = fullSuite || studioE2eChanged(nonMarkdownChangedFiles) || affected(isExternalE2eTest) || changed(file =>
            (file.startsWith('e2e-tests/') &&
              !file.startsWith('e2e-tests/experiment-worker/') &&
              !file.startsWith('e2e-tests/_local-registry-setup/')) ||
            file.startsWith('packages/playground/e2e/') ||
            file.startsWith('packages/playground-ui/') ||
            file.startsWith('server-adapters/hono/') ||
            file.startsWith('packages/server/') ||
            // e2e-mcp-compat: the core MCP/tool contract must keep published @mastra/mcp 1.x working.
            file.startsWith('packages/core/src/mcp/') ||
            file.startsWith('packages/core/src/tools/') ||
            file.startsWith('packages/mcp/integration-tests/') ||
            file === '.github/workflows/e2e-tests.yml' ||
            file === 'pnpm-lock.yaml'
          );
          const mastracodeE2eChanged = fullSuite || changed(file =>
            file.startsWith('mastracode/') ||
            file.startsWith('packages/core/') ||
            file === 'pnpm-lock.yaml' ||
            file === '.github/workflows/mastracode-e2e.yml'
          );

          output(`affected_store_tests=${affectedStoreTests}\n`);
          const workspaceDockerPackages = workspaceSelection.packages.filter(packageName =>
            ['s3', 'gcs', 'azure'].includes(packageName),
          );
          output(`affected_workspace_tests=${affectedWorkspaceTests}\n`);
          output(`workspace_packages=${JSON.stringify(workspaceSelection.packages)}\n`);
          output(`workspace_docker_packages=${JSON.stringify(workspaceDockerPackages)}\n`);
          output(`affected_memory_tests=${affectedMemoryTests}\n`);
          output(`stores_changed=${storesChanged}\n`);
          output(`workspaces_changed=${workspacesChanged}\n`);
          const { experimentWorkerE2eChanged } = require('./.github/scripts/experiment-worker-routing.cjs');
          const experimentEntryFiles = ['packages/cli/src/commands/index.ts', 'packages/cli/src/index.ts'];
          const changedEntryFiles = changedFiles.filter(file => experimentEntryFiles.includes(file));
          const experimentEntryDiff = changedEntryFiles.length
            ? require('child_process').execFileSync(
                'git',
                ['diff', '--unified=0', `${process.env.BASE_SHA}...${process.env.HEAD_SHA}`, '--', ...changedEntryFiles],
                { encoding: 'utf8' },
              )
            : '';
          const experimentWorkerChanged = fullSuite || experimentWorkerE2eChanged(nonMarkdownChangedFiles, experimentEntryDiff);

          output(`memory_changed=${memoryChanged}\n`);
          output(`e2e_changed=${e2eChanged}\n`);
          output(`experiment_worker_e2e_changed=${experimentWorkerChanged}\n`);
          output(`mastracode_e2e_changed=${mastracodeE2eChanged}\n`);

          console.error(`Affected: ${count}/${total} tests (${(ratio * 100).toFixed(1)}%)`);
          console.error(`Affected unit/type tests: ${unitTestFiles.length}`);
          console.error(`Affected package E2E tests: ${e2eTestFiles.length}`);
          console.error(`Workspace packages (${workspaceSelection.reason}): ${workspaceSelection.packages.join(', ') || 'none'}`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Workspace test routing\n\n- Reason: \`${workspaceSelection.reason}\`\n- Packages: ${workspaceSelection.packages.length ? workspaceSelection.packages.map(pkg => `\`${pkg}\``).join(', ') : 'none'}\n`,
          );

          if (runFull) {
            console.error('Full suite requested — running full suite.');
            output('run_full=true\n');
            output('has_unit_tests=false\n');
            output('e2e_test_files=\n');
          } else {
            console.error(`Running ${count} affected tests.`);
            output('run_full=false\n');
            // The unit list can reach hundreds of KB, so it travels as an artifact; the job
            // output only says whether there is one.
            output(`has_unit_tests=${unitTestFiles.length > 0}\n`);
            outputList('e2e_test_files', e2eTestFiles);
          }
          NODE

      - name: Save affected-tests outputs for downstream workflow
        if: always()
        env:
          E2E_CHANGED: ${{ steps.compute.outputs.e2e_changed }}
          EXPERIMENT_WORKER_E2E_CHANGED: ${{ steps.compute.outputs.experiment_worker_e2e_changed }}
          MASTRACODE_E2E_CHANGED: ${{ steps.compute.outputs.mastracode_e2e_changed }}
          STORES_CHANGED: ${{ steps.compute.outputs.stores_changed }}
          WORKSPACES_CHANGED: ${{ steps.compute.outputs.workspaces_changed }}
          MEMORY_CHANGED: ${{ steps.compute.outputs.memory_changed }}
          AFFECTED_STORE_TESTS: ${{ steps.compute.outputs.affected_store_tests }}
          AFFECTED_WORKSPACE_TESTS: ${{ steps.compute.outputs.affected_workspace_tests }}
          WORKSPACE_PACKAGES: ${{ steps.compute.outputs.workspace_packages }}
          AFFECTED_MEMORY_TESTS: ${{ steps.compute.outputs.affected_memory_tests }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: |
          mkdir -p /tmp/affected-outputs
          echo "$E2E_CHANGED" > /tmp/affected-outputs/e2e_changed.txt
          echo "$EXPERIMENT_WORKER_E2E_CHANGED" > /tmp/affected-outputs/experiment_worker_e2e_changed.txt
          echo "$MASTRACODE_E2E_CHANGED" > /tmp/affected-outputs/mastracode_e2e_changed.txt
          echo "$STORES_CHANGED" > /tmp/affected-outputs/stores_changed.txt
          echo "$WORKSPACES_CHANGED" > /tmp/affected-outputs/workspaces_changed.txt
          echo "$MEMORY_CHANGED" > /tmp/affected-outputs/memory_changed.txt
          echo "$AFFECTED_STORE_TESTS" > /tmp/affected-outputs/affected_store_tests.txt
          echo "$AFFECTED_WORKSPACE_TESTS" > /tmp/affected-outputs/affected_workspace_tests.txt
          echo "$WORKSPACE_PACKAGES" > /tmp/affected-outputs/workspace_packages.json
          echo "$AFFECTED_MEMORY_TESTS" > /tmp/affected-outputs/affected_memory_tests.txt
          echo "$BASE_SHA" > /tmp/affected-outputs/base_sha.txt
          echo "$HEAD_SHA" > /tmp/affected-outputs/head_sha.txt

      - name: Upload affected-tests artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-tests-outputs
          path: /tmp/affected-outputs/
          retention-days: 1

  test-suite:
    name: Unit and E2E Tests
    needs: [changes, prebuild, affected-tests]
    if: always() && github.repository == 'mastra-ai/mastra' && needs.changes.result == 'success' && (needs.changes.outputs.has_code != 'true' || needs.prebuild.result == 'success')
    uses: ./.github/workflows/test-suite.yml
    permissions:
      actions: read
      contents: read
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      has_code: ${{ needs.changes.outputs.has_code }}
      has_unit_tests: ${{ needs.affected-tests.outputs.has_unit_tests }}
      e2e_test_files: ${{ needs.affected-tests.outputs.e2e_test_files }}
      run_full: ${{ needs.affected-tests.outputs.run_full }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  e2e-tests:
    name: E2E Tests
    needs: [changes, affected-tests, prebuild]
    if: always() && github.repository == 'mastra-ai/mastra' && (needs.affected-tests.outputs.e2e_changed == 'true' || needs.affected-tests.outputs.experiment_worker_e2e_changed == 'true') && needs.prebuild.result == 'success'
    uses: ./.github/workflows/e2e-tests.yml
    permissions:
      contents: read
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      experiment_worker_e2e_changed: ${{ needs.affected-tests.outputs.experiment_worker_e2e_changed == 'true' }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  mastracode-e2e:
    name: Mastra Code E2E
    needs: [changes, affected-tests, prebuild]
    if: always() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.mastracode_e2e_changed == 'true' && needs.prebuild.result == 'success'
    uses: ./.github/workflows/mastracode-e2e.yml
    permissions:
      contents: read
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  combined-stores-tests:
    name: Combined Store Tests
    needs: [changes, affected-tests, prebuild]
    if: always() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.stores_changed == 'true' && needs.prebuild.result == 'success'
    uses: ./.github/workflows/test-combined-stores.yml
    permissions:
      contents: read
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      ASTRA_DB_ENDPOINT: ${{ secrets.ASTRA_DB_ENDPOINT }}
      ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
      ABHI_CLOUDFLARE_API_TOKEN: ${{ secrets.ABHI_CLOUDFLARE_API_TOKEN }}
      ABHI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ABHI_CLOUDFLARE_ACCOUNT_ID }}

  workspace-tests:
    name: Workspace Tests
    needs: [changes, affected-tests, prebuild]
    if: always() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.workspaces_changed == 'true' && needs.prebuild.result == 'success'
    uses: ./.github/workflows/test-workspaces.yml
    permissions:
      contents: read
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      workspace_packages: ${{ needs.affected-tests.outputs.workspace_packages }}
      workspace_docker_packages: ${{ needs.affected-tests.outputs.workspace_docker_packages }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  memory-test:
    name: Memory Tests
    needs: [changes, affected-tests, prebuild]
    if: always() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.memory_changed == 'true' && needs.prebuild.result == 'success'
    runs-on: starsling-ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mastra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build dependencies
        run: pnpm turbo build --filter "./stores/libsql" --filter "./stores/pg" --filter "./stores/upstash" --filter "mastra" --filter "@mastra/memory" --filter "@mastra/fastembed" --filter "@internal/llm-recorder" --filter "@internal/test-utils"
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Install integration test dependencies
        run: pnpm install
        working-directory: packages/memory/integration-tests

      - name: Run Memory tests
        run: pnpm vitest run
        working-directory: packages/memory/integration-tests
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          DB_URL: 'postgresql://postgres:postgres@localhost:5432/mastra'

  # The Changesets release PR gates every release, so a red suite there should not wait for
  # someone to open the PR. It alerts once when the suite goes red and once when it is green
  # again, not on every push in between. Calls (e.g. the alpha cron) send their own alert.
  notify-release-pr-status:
    name: Notify Slack of release PR status
    needs:
      [
        changes,
        prebuild,
        affected-tests,
        test-suite,
        e2e-tests,
        mastracode-e2e,
        combined-stores-tests,
        workspace-tests,
        memory-test,
      ]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/')
    runs-on: starsling-ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Compare with the previous release PR run
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A cancelled run was usually superseded by a newer push, which reports instead.
          # Failures seen before the cancel would otherwise alert once per superseded run.
          if [ "$CANCELLED" = "true" ]; then
            echo "Run was cancelled; leaving the alert state unchanged."
            exit 0
          fi

          # Judge earlier runs by their test jobs, the same way this run is judged. The run
          # conclusion is not usable: a newer push marks a run cancelled even when every job
          # already passed, so a green run would be skipped and each later green push would
          # alert "green again" against the last red one.
          # Prints failure, success, or nothing when the run was cancelled or unreadable.
          job_state() {
            local conclusions
            conclusions=$(gh api --paginate "$1?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Notify Slack") | not) | .conclusion' 2>/dev/null) || return 0
            if grep -qxE 'failure|timed_out' <<< "$conclusions"; then
              echo failure
            elif [ -n "$conclusions" ] && ! grep -qx cancelled <<< "$conclusions"; then
              echo success
            fi
          }

          # A re-run keeps its run ID, so its previous state is the earlier attempt of this run.
          # Cancelled attempts are skipped, so walk back to the newest one that finished.
          previous=''
          attempt=$((GITHUB_RUN_ATTEMPT - 1))
          while [ -z "$previous" ] && [ "$attempt" -ge 1 ]; do
            previous=$(job_state "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs")
            attempt=$((attempt - 1))
          done

          # Otherwise this run is still in progress, so the newest completed run is the previous one.
          # Most release PR runs are cancelled by newer pushes, so walk past them.
          if [ -z "$previous" ]; then
            if ! runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/prebuild.yml/runs" \
              -f branch="$BRANCH" -f event=pull_request -f status=completed -F per_page=50 \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | \"\(.id)/attempts/\(.run_attempt)\""); then
              echo "::warning::Could not read the previous run; alerting on failure only."
              previous=unknown
            fi
            for run in $runs; do
              previous=$(job_state "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs")
              [ -n "$previous" ] && break
            done
          fi
          previous=${previous:-none}
          echo "Previous release PR run: $previous; this run failed: $FAILED"

          pr="<$PR_URL|#$PR_NUMBER $PR_TITLE>"
          if [ "$FAILED" = "true" ] && [ "$previous" != "failure" ]; then
            echo "text=:rotating_light: Release PR tests failed: $pr. <$RUN_URL|View the run>." >> "$GITHUB_OUTPUT"
          elif [ "$FAILED" != "true" ] && [ "$previous" = "failure" ]; then
            echo "text=:white_check_mark: Release PR tests are green again: $pr." >> "$GITHUB_OUTPUT"
          else
            echo "No change since the previous run; not alerting."
          fi

      - name: Checkout Slack action
        if: steps.state.outputs.text != ''
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Post to Slack
        if: steps.state.outputs.text != ''
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: ${{ steps.state.outputs.text }}
