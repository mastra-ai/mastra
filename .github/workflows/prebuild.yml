name: Prebuild

on:
  # No base-branch filter: a stacked PR (based on another PR's branch) runs the same
  # tests it would on main, diffed against main (see "Check for code changes").
  pull_request:
    types: [opened, synchronize, reopened]
  # Lets other workflows (e.g. the alpha cron, which publishes without a PR) gate on the
  # full suite without duplicating these jobs. A call always runs the full suite on the
  # caller's commit.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect code changes
    runs-on: starsling-ubuntu-26.04-2
    permissions:
      contents: read
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
      head_sha: ${{ steps.filter.outputs.head_sha }}
      base_sha: ${{ steps.filter.outputs.base_sha }}
      full_suite: ${{ steps.filter.outputs.full_suite }}
    steps:
      - name: Checkout repo
        if: github.event_name == 'pull_request'
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Check for code changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # A workflow_call (e.g. the alpha cron) and the Changesets release PR run the full
          # suite. Every other PR runs only the tests affected by its diff. A fork can pick any
          # branch name, so the release PR head must also live in this repository.
          FULL_SUITE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/')) }}
        run: |
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "full_suite=$FULL_SUITE" >> "$GITHUB_OUTPUT"

          # A stacked PR merges into another PR's branch, but its code ends up on main, so
          # diff it against main to select the same tests the stack will need there.
          BASE_SHA=$PR_BASE_SHA
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" != "main" ] && [ "$BASE_REF" != "0.x" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
            echo "Stacked on $BASE_REF; diffing against main at $BASE_SHA."
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          if [ "$FULL_SUITE" = "true" ]; then
            echo "Full suite requested; running Prebuild."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "Could not diff the PR; running affected tests fail-closed."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_files=$(printf '%s\n' "$changed_files" \
            | grep -vE '^(docs/|examples/|\.changeset/|explorations/)' \
            | grep -v '^$' || true)
          if [ -n "$code_files" ]; then
            echo "Code changes found; running affected tests."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, examples, changesets or explorations changed; skipping Prebuild."
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  # Deployer changes must come with monorepo E2E coverage (packages/deployer/AGENTS.md).
  # Its own job, not a step in `changes`: a failing `changes` job would skip every test job.
  deployer-e2e-coverage:
    name: Deployer E2E coverage
    # The Changesets release PR only bumps versions and changelogs, so it can never add the
    # coverage. A fork can pick any branch name, so the head must also live in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'changeset-release/'))
    runs-on: starsling-ubuntu-26.04-2
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Require monorepo E2E changes alongside deployer changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          # The package instructions and the generated changelog are exempt.
          deployer_file=$(printf '%s\n' "$changed_files" \
            | grep '^packages/deployer/' \
            | grep -vxE 'packages/deployer/(AGENTS|CHANGELOG)\.md' \
            | head -n 1 || true)
          if [ -z "$deployer_file" ]; then
            echo "No deployer changes."
            exit 0
          fi
          # Here-string, not a pipe: under pipefail, grep -q exiting early can fail printf.
          if grep -q '^e2e-tests/monorepo/' <<< "$changed_files"; then
            echo "Deployer changes come with monorepo E2E changes."
            exit 0
          fi
          deployer_file="${deployer_file//%/%25}"
          deployer_file="${deployer_file//:/%3A}"
          deployer_file="${deployer_file//,/%2C}"
          echo "::error file=${deployer_file},title=Monorepo E2E coverage required::This PR changes packages/deployer/ but has no changes under e2e-tests/monorepo/. Deployer unit tests alone do not validate generated monorepo applications; add or update a monorepo E2E test. See packages/deployer/AGENTS.md."
          exit 1

  prebuild:
    name: Build
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 20
    if: needs.changes.outputs.has_code == 'true' && github.repository == 'mastra-ai/mastra'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          fetch-depth: 2

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm turbo --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*" build

  affected-tests:
    name: Detect affected tests
    needs: changes
    if: github.repository == 'mastra-ai/mastra' && needs.changes.outputs.has_code == 'true'
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_full: ${{ steps.compute.outputs.run_full }}
      has_unit_tests: ${{ steps.compute.outputs.has_unit_tests }}
      unit_shards: ${{ steps.compute.outputs.unit_shards }}
      e2e_test_files: ${{ steps.compute.outputs.e2e_test_files }}
      e2e_changed: ${{ steps.compute.outputs.e2e_changed }}
      experiment_worker_e2e_changed: ${{ steps.compute.outputs.experiment_worker_e2e_changed }}
      mastracode_e2e_changed: ${{ steps.compute.outputs.mastracode_e2e_changed }}
      durable_streams_changed: ${{ steps.compute.outputs.durable_streams_changed }}
      stores_changed: ${{ steps.compute.outputs.stores_changed }}
      workspaces_changed: ${{ steps.compute.outputs.workspaces_changed }}
      memory_changed: ${{ steps.compute.outputs.memory_changed }}
      workspace_packages: ${{ steps.compute.outputs.workspace_packages }}
      workspace_docker_packages: ${{ steps.compute.outputs.workspace_docker_packages }}
      tier_skip_jobs: ${{ steps.compute.outputs.tier_skip_jobs }}
    permissions:
      contents: read
      id-token: write
      # Reads the PR's labels (full-tests).
      issues: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: false

      - name: Install affected-test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter mastra-turbo

      # What detection extracts from each file is cached by content hash
      # (scripts/affected-tests-cache.mjs); resolution still runs live, so a
      # stale or missing cache only costs time. Seeded on every push to main by
      # affected-graph-seed.yml. PRs only restore it, so per-PR runs don't fill
      # the repo's cache quota.
      - name: Restore affected-test extraction cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/affected-graph.json
          key: affected-graph-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: affected-graph-v1-${{ runner.os }}-

      - name: Compute affected test files
        id: compute
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
          AFFECTED_TESTS_CACHE: ${{ runner.temp }}/affected-graph.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          TIERS_PATH: /tmp/tiers.json
        run: |
          # Test tiers (scripts/test-tiers/select.mjs): files and jobs marked `out` on the
          # ci/test-tiers branch skip PRs that don't edit them. Without the branch, everything runs.
          if git fetch --quiet --depth 1 origin ci/test-tiers && git show FETCH_HEAD:tiers.json > "$TIERS_PATH"; then
            echo "Loaded tiers.json from ci/test-tiers."
          else
            rm -f "$TIERS_PATH"
            echo "No ci/test-tiers branch; the tier filter will run everything."
          fi
          # The full-tests label is read live, so re-running the job after adding it is enough.
          # If the labels can't be read, run everything.
          FULL_TESTS_LABEL=false
          if [ -n "$PR_NUMBER" ]; then
            if labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name'); then
              if grep -qx 'full-tests' <<< "$labels"; then FULL_TESTS_LABEL=true; fi
            else
              echo "::warning::Could not read PR labels; running every test."
              FULL_TESTS_LABEL=true
            fi
          fi
          export FULL_TESTS_LABEL
          node .github/scripts/select-affected-tests.cjs

      - name: Upload affected-tests artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-tests-outputs
          path: /tmp/affected-outputs/
          retention-days: 1

  test-suite:
    name: Unit and E2E Tests
    needs: [changes, prebuild, affected-tests]
    if: ${{ !cancelled() && github.repository == 'mastra-ai/mastra' && needs.changes.result == 'success' && (needs.changes.outputs.has_code != 'true' || needs.prebuild.result == 'success') }}
    uses: ./.github/workflows/test-suite.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      has_code: ${{ needs.changes.outputs.has_code }}
      has_unit_tests: ${{ needs.affected-tests.outputs.has_unit_tests }}
      unit_shards: ${{ needs.affected-tests.outputs.unit_shards || '[1]' }}
      e2e_test_files: ${{ needs.affected-tests.outputs.e2e_test_files }}
      run_full: ${{ needs.affected-tests.outputs.run_full }}
      durable_streams_changed: ${{ needs.affected-tests.outputs.durable_streams_changed }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  e2e-tests:
    name: E2E Tests
    needs: [changes, affected-tests, prebuild]
    if: ${{ !cancelled() && github.repository == 'mastra-ai/mastra' && (needs.affected-tests.outputs.e2e_changed == 'true' || needs.affected-tests.outputs.experiment_worker_e2e_changed == 'true') && needs.prebuild.result == 'success' }}
    uses: ./.github/workflows/e2e-tests.yml
    permissions:
      contents: read
      id-token: write
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      experiment_worker_e2e_changed: ${{ needs.affected-tests.outputs.experiment_worker_e2e_changed == 'true' }}
      skip_jobs: ${{ needs.affected-tests.outputs.tier_skip_jobs || '[]' }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  mastracode-e2e:
    name: Mastra Code E2E
    needs: [changes, affected-tests, prebuild]
    if: ${{ !cancelled() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.mastracode_e2e_changed == 'true' && needs.prebuild.result == 'success' }}
    uses: ./.github/workflows/mastracode-e2e.yml
    permissions:
      contents: read
      id-token: write
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      skip_jobs: ${{ needs.affected-tests.outputs.tier_skip_jobs || '[]' }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  combined-stores-tests:
    name: Combined Store Tests
    needs: [changes, affected-tests, prebuild]
    if: ${{ !cancelled() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.stores_changed == 'true' && needs.prebuild.result == 'success' }}
    uses: ./.github/workflows/test-combined-stores.yml
    permissions:
      contents: read
      id-token: write
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      skip_jobs: ${{ needs.affected-tests.outputs.tier_skip_jobs || '[]' }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      ASTRA_DB_ENDPOINT: ${{ secrets.ASTRA_DB_ENDPOINT }}
      ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
      ABHI_CLOUDFLARE_API_TOKEN: ${{ secrets.ABHI_CLOUDFLARE_API_TOKEN }}
      ABHI_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ABHI_CLOUDFLARE_ACCOUNT_ID }}

  workspace-tests:
    name: Workspace Tests
    needs: [changes, affected-tests, prebuild]
    if: ${{ !cancelled() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.workspaces_changed == 'true' && needs.prebuild.result == 'success' }}
    uses: ./.github/workflows/test-workspaces.yml
    permissions:
      contents: read
      id-token: write
    with:
      head_sha: ${{ needs.changes.outputs.head_sha }}
      workspace_packages: ${{ needs.affected-tests.outputs.workspace_packages }}
      workspace_docker_packages: ${{ needs.affected-tests.outputs.workspace_docker_packages }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  memory-test:
    name: Memory Tests
    needs: [changes, affected-tests, prebuild]
    if: ${{ !cancelled() && github.repository == 'mastra-ai/mastra' && needs.affected-tests.outputs.memory_changed == 'true' && needs.prebuild.result == 'success' }}
    runs-on: starsling-ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mastra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build dependencies
        run: pnpm turbo build --filter "./stores/libsql" --filter "./stores/pg" --filter "./stores/upstash" --filter "mastra" --filter "@mastra/memory" --filter "@mastra/fastembed" --filter "@internal/llm-recorder" --filter "@internal/test-utils"
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Install integration test dependencies
        run: pnpm install
        working-directory: packages/memory/integration-tests

      - name: Run Memory tests
        run: pnpm vitest run
        working-directory: packages/memory/integration-tests
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          DB_URL: 'postgresql://postgres:postgres@localhost:5432/mastra'

  # The Changesets release PR gates every release, so a red suite there should not wait for
  # someone to open the PR. It alerts once when the suite goes red and once when it is green
  # again, not on every push in between. Calls (e.g. the alpha cron) send their own alert.
  notify-release-pr-status:
    name: Notify Slack of release PR status
    needs:
      [
        changes,
        prebuild,
        affected-tests,
        test-suite,
        e2e-tests,
        mastracode-e2e,
        combined-stores-tests,
        workspace-tests,
        memory-test,
      ]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/')
    runs-on: starsling-ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Compare with the previous release PR run
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A cancelled run was usually superseded by a newer push, which reports instead.
          # Failures seen before the cancel would otherwise alert once per superseded run.
          if [ "$CANCELLED" = "true" ]; then
            echo "Run was cancelled; leaving the alert state unchanged."
            exit 0
          fi

          # Judge earlier runs by their test jobs, the same way this run is judged. The run
          # conclusion is not usable: a newer push marks a run cancelled even when every job
          # already passed, so a green run would be skipped and each later green push would
          # alert "green again" against the last red one.
          # Prints failure, success, or nothing when the run was cancelled or unreadable.
          job_state() {
            local conclusions
            conclusions=$(gh api --paginate "$1?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Notify Slack") | not) | .conclusion' 2>/dev/null) || return 0
            if grep -qxE 'failure|timed_out' <<< "$conclusions"; then
              echo failure
            elif [ -n "$conclusions" ] && ! grep -qx cancelled <<< "$conclusions"; then
              echo success
            fi
          }

          # A re-run keeps its run ID, so its previous state is the earlier attempt of this run.
          # Cancelled attempts are skipped, so walk back to the newest one that finished.
          previous=''
          attempt=$((GITHUB_RUN_ATTEMPT - 1))
          while [ -z "$previous" ] && [ "$attempt" -ge 1 ]; do
            previous=$(job_state "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs")
            attempt=$((attempt - 1))
          done

          # Otherwise this run is still in progress, so the newest completed run is the previous one.
          # Most release PR runs are cancelled by newer pushes, so walk past them.
          if [ -z "$previous" ]; then
            if ! runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/prebuild.yml/runs" \
              -f branch="$BRANCH" -f event=pull_request -f status=completed -F per_page=50 \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | \"\(.id)/attempts/\(.run_attempt)\""); then
              echo "::warning::Could not read the previous run; alerting on failure only."
              previous=unknown
            fi
            for run in $runs; do
              previous=$(job_state "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs")
              [ -n "$previous" ] && break
            done
          fi
          previous=${previous:-none}
          echo "Previous release PR run: $previous; this run failed: $FAILED"

          pr="<$PR_URL|#$PR_NUMBER $PR_TITLE>"
          if [ "$FAILED" = "true" ] && [ "$previous" != "failure" ]; then
            echo "text=:rotating_light: Release PR tests failed: $pr. <$RUN_URL|View the run>." >> "$GITHUB_OUTPUT"
          elif [ "$FAILED" != "true" ] && [ "$previous" = "failure" ]; then
            echo "text=:white_check_mark: Release PR tests are green again: $pr." >> "$GITHUB_OUTPUT"
          else
            echo "No change since the previous run; not alerting."
          fi

      - name: Checkout Slack action
        if: steps.state.outputs.text != ''
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Post to Slack
        if: steps.state.outputs.text != ''
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: ${{ steps.state.outputs.text }}
          # #eng-release-alerts
          channel: 'C0CD83YFFNF'
