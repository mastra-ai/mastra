name: Upload Studio to R2

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version to build (e.g. 1.3.14)'
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}

jobs:
  upload-studio:
    name: Build and Upload Studio
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r
    steps:
      - name: Initial checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 1
          ref: mastra@${{ inputs.version }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build packages
        run: pnpm turbo build --filter="mastra"

      - name: Upload studio assets to R2 (production)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STUDIO_R2_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STUDIO_R2_ACCESS_SECRET_PROD }}
          STUDIO_BUCKET_NAME: ${{ vars.STUDIO_R2_BUCKET_PROD }}
          STUDIO_ENDPOINT_URL: ${{ vars.STUDIO_R2_ENDPOINT_URL_PROD }}
          VERSION: ${{ inputs.version }}
        run: |
          aws s3 sync packages/cli/dist/studio "s3://${STUDIO_BUCKET_NAME}/${VERSION}/studio/" \
            --endpoint-url "${STUDIO_ENDPOINT_URL}" \
            --delete
