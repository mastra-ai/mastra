name: Cron Alpha Version

permissions:
  contents: read

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

concurrency:
  group: alpha-prerelease-main
  cancel-in-progress: false

jobs:
  # While main is frozen for a release (release-freeze.yml), a scheduled alpha would push
  # to main and restart the versioning PR's CI, so scheduled runs stop here. A manual run
  # still publishes. Read at run time, so unfreezing needs nothing else.
  freeze-check:
    name: Skip while main is frozen
    if: ${{ github.repository == 'mastra-ai/mastra' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frozen: ${{ steps.check.outputs.frozen }}
    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Is main frozen?
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-freeze.mjs --action check

      - name: Say why the alpha is skipped
        if: steps.check.outputs.frozen == 'true'
        run: |
          echo "Skipped the scheduled alpha: main is frozen for a release." >> "$GITHUB_STEP_SUMMARY"

  # Alphas publish straight from main with no release PR, so they get the same full suite
  # the release PR runs. Prebuild is reused rather than duplicated here.
  test:
    name: Full test suite
    needs: freeze-check
    # always() so a manual run (freeze-check skipped) still goes; a failed check stops it.
    if: |
      always() &&
      github.repository == 'mastra-ai/mastra' && github.ref == 'refs/heads/main' &&
      (needs.freeze-check.result == 'skipped' ||
       (needs.freeze-check.result == 'success' && needs.freeze-check.outputs.frozen != 'true'))
    uses: ./.github/workflows/prebuild.yml
    # Must cover every permission prebuild's jobs request, or the run fails at startup.
    # id-token: write is for StarSling Disks.
    permissions:
      actions: read
      contents: read
      id-token: write
    secrets: inherit

  notify-test-failure:
    name: Notify Slack of test failure
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: starsling-ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Slack action
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Post to Slack
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: ':rotating_light: Alpha publish blocked: the full test suite failed on main at <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run> and re-run failed jobs to publish.'

  alpha-version:
    needs: test
    if: ${{ github.repository == 'mastra-ai/mastra' && github.ref == 'refs/heads/main' }}
    # Shares release-freeze.yml's group, so a freeze never runs while this job is about to
    # push, and the check before the push below sees any freeze that finished first.
    concurrency:
      group: release-merge-freeze
      cancel-in-progress: false
      queue: max
    runs-on: starsling-ubuntu-26.04
    steps:
      - name: Initial checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dane App Auth
        id: app-auth
        uses: ./.github/actions/app-auth
        with:
          client-id: ${{ vars.DANE_CLIENT_ID }}
          private-key: ${{ secrets.DANE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Re-checkout with app token
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          token: ${{ steps.app-auth.outputs.token }}
          fetch-depth: 0
          # Partial clone: changelogs need commits and trees, not every historical
          # file version. Cuts the full-history fetch from minutes to seconds.
          filter: blob:none
          persist-credentials: true

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Ensure alpha prerelease mode
        id: ensure-prerelease
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          HUSKY: 0
        run: |
          if [ -f .changeset/pre.json ]; then
            node <<'NODE'
          const { readFileSync } = require('node:fs');
          const pre = JSON.parse(readFileSync('.changeset/pre.json', 'utf8'));
          if (pre.mode !== 'pre' || pre.tag !== 'alpha') {
            console.error(`Expected .changeset/pre.json to be in alpha pre mode, got mode=${pre.mode} tag=${pre.tag}`);
            process.exit(1);
          }
          NODE
            echo "Already in alpha prerelease mode"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Version packages (alpha prerelease)
        if: steps.ensure-prerelease.outputs.restored != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          HUSKY: 0
        run: pnpm changeset-cli version

      - name: Check for changes
        id: check-changes
        if: steps.ensure-prerelease.outputs.restored != 'true'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No version changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Version changes detected:"
            git diff --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump mcp-docs-server prerelease version
        if: steps.ensure-prerelease.outputs.restored != 'true' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          cd packages/mcp-docs-server
          pnpm version prerelease --preid alpha --no-git-checks --no-git-tag-version
          cd ../..

      # The tests above take a while; main may have been frozen since freeze-check ran.
      - name: Is main frozen now?
        id: freeze-recheck
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-freeze.mjs --action check

      - name: Say why the alpha is skipped
        if: steps.freeze-recheck.outputs.frozen == 'true'
        run: |
          echo "Skipped the scheduled alpha: main was frozen for a release while it ran." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push version changes
        if: steps.ensure-prerelease.outputs.restored != 'true' && steps.check-changes.outputs.has_changes == 'true' && steps.freeze-recheck.outputs.frozen != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          HUSKY: 0
        run: |
          git add -A
          git commit -m "chore: version packages"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
