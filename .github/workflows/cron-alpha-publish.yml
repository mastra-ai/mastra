name: Cron Alpha Version

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

concurrency:
  group: alpha-prerelease-main
  cancel-in-progress: false

jobs:
  alpha-version:
    if: ${{ github.repository == 'mastra-ai/mastra' && github.ref == 'refs/heads/main' }}
    runs-on: starsling-ubuntu-26.04
    steps:
      - name: Initial checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dane App Auth
        id: app-auth
        uses: ./.github/actions/app-auth
        with:
          client-id: ${{ vars.DANE_CLIENT_ID }}
          private-key: ${{ secrets.DANE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Re-checkout with app token
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          token: ${{ steps.app-auth.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Ensure alpha prerelease mode
        id: ensure-prerelease
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          HUSKY: 0
        run: |
          if [ -f .changeset/pre.json ]; then
            node <<'NODE'
          const { readFileSync } = require('node:fs');
          const pre = JSON.parse(readFileSync('.changeset/pre.json', 'utf8'));
          if (pre.mode !== 'pre' || pre.tag !== 'alpha') {
            console.error(`Expected .changeset/pre.json to be in alpha pre mode, got mode=${pre.mode} tag=${pre.tag}`);
            process.exit(1);
          }
          NODE
            echo "Already in alpha prerelease mode"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Version packages (alpha prerelease)
        if: steps.ensure-prerelease.outputs.restored != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          HUSKY: 0
        run: pnpm changeset-cli version

      - name: Check for changes
        id: check-changes
        if: steps.ensure-prerelease.outputs.restored != 'true'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No version changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Version changes detected:"
            git diff --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump mcp-docs-server prerelease version
        if: steps.ensure-prerelease.outputs.restored != 'true' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          cd packages/mcp-docs-server
          pnpm version prerelease --preid alpha --no-git-checks --no-git-tag-version
          cd ../..

      - name: Commit and push version changes
        id: push-version
        if: steps.ensure-prerelease.outputs.restored != 'true' && steps.check-changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          HUSKY: 0
        run: |
          git add -A
          git commit -m "chore: version packages"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The changesets consumed above are also versioned on the release PR branch, which now
      # conflicts with main. Deleting the branch closes the PR; version-packages.yml recreates
      # it from main on the next push that adds a changeset.
      # Version Packages runs for commits before our push would recreate the branch from that
      # older main, so wait for them to finish first. Runs for our commit or later ones are safe.
      - name: Close stale release PR
        if: steps.ensure-prerelease.outputs.restored != 'true' && steps.check-changes.outputs.has_changes == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_SHA: ${{ steps.push-version.outputs.sha }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          while true; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            pending=""
            for sha in $(gh run list --workflow version-packages.yml --branch "${GITHUB_REF_NAME}" --limit 100 \
              --json headSha,status --jq '.[] | select(.status != "completed") | .headSha' | sort -u); do
              if ! git merge-base --is-ancestor "${VERSION_SHA}" "${sha}" 2>/dev/null; then
                pending="${pending} ${sha}"
              fi
            done
            [ -z "${pending}" ] && break
            echo "Waiting for Version Packages runs on older commits:${pending}"
            sleep 20
          done

          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" > /dev/null; then
            git push origin --delete "${RELEASE_BRANCH}"
          else
            echo "No ${RELEASE_BRANCH} branch to delete"
          fi
