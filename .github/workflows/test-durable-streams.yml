name: Durable Stream Tests

# Drives real worker processes against a real Redis stream broker and a Postgres
# workflow store. Nothing else in CI provisions both, so durability regressions
# (lease ownership, worker takeover, API loss) otherwise ship untested.
on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

permissions: {}

jobs:
  worker-takeover:
    name: Worker takeover (Redis + Postgres)
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Mounts the StarSling Disks pnpm store (setup-pnpm-node).
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r
      REDIS_URL: redis://localhost:6381
      POSTGRES_CONNECTION_STRING: postgres://postgres:postgres@localhost:5436/postgres

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      # Read before any step runs: keep the checkout above as the first step, and this step without if:.
      - name: Speed up checkout with the StarSling git mirror
        uses: starslingdev/disks@de780d2849eb11f317f7e393de0949f100dd4eb2 # v0.2.0
        with:
          git-mirror: true

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Fixture child processes import the built packages, so `dist` must exist.
      - name: Build dependencies
        run: pnpm turbo build --filter @mastra/core --filter @mastra/pg --filter @mastra/redis-streams --filter '@mastra/factory^...'
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Typecheck durability fixtures
        run: pnpm --filter @mastra/redis-streams run --if-present check:test
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      # These suites need a real Redis and Postgres at the same time, which only
      # this job provisions.
      # Each test uses its own Postgres schema and Redis key prefix (none flushes the shared
      # Redis), so the three files run in parallel; a 3s lease (production keeps 15s) shortens
      # the takeover waits they assert on.
      - name: Run durability tests
        run: pnpm vitest run --file-parallelism --max-workers=3 src/durable-worker-takeover.test.ts src/plain-run-cross-server.test.ts src/durable-full-restart.test.ts
        working-directory: pubsub/redis-streams
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          MASTRA_AGENT_THREAD_LEASE_TTL_MS: '3000'

      - name: Verify native evented request context
        run: pnpm exec vitest run src/agentic-loop-pubsub.test.ts src/cross-host-resume-context.test.ts -t 'retains live request context|uses resumed request context|resuming caller context' --reporter=verbose
        working-directory: pubsub/redis-streams

      - name: Verify evented Factory title persistence
        run: pnpm exec vitest run src/rules/board-phase-runtime.test.ts -t 'persists a generated title for an evented Factory session over Redis Streams' --reporter=verbose
        working-directory: mastracode/factory
        env:
          FACTORY_TEST_POSTGRES_URL: ${{ env.POSTGRES_CONNECTION_STRING }}
          FACTORY_TEST_REDIS_URL: ${{ env.REDIS_URL }}
