name: Workspace Cloud Tests

on:
  workflow_run:
    workflows: ['Prebuild']
    types:
      - completed

concurrency:
  # A run triggered by a cancelled Prebuild does nothing (see check-changes), so
  # give it its own group: it must not cancel a real run for the same SHA.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.conclusion == 'cancelled' && github.run_id || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  check-changes:
    # A cancelled Prebuild means a newer push superseded this commit; that push
    # gets its own Prebuild and Cloud Tests run.
    if: ${{ github.repository == 'mastra-ai/mastra' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: starsling-ubuntu-26.04-2
    outputs:
      workspaces-changed: ${{ steps.check.outputs.workspaces-changed }}
      packages: ${{ steps.check.outputs.packages }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      # Checkout the default branch so local actions are loaded from a trusted
      # ref, not the workflow_run head SHA which may come from an untrusted PR.
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none
          persist-credentials: false
      - name: Set pending status
        uses: ./.github/workflows/shared-actions/set-pr-status
        with:
          status: 'pending'
          context: 'Workspace Cloud Tests'
          description: 'Checking for changes'
          sha: ${{ github.event.workflow_run.head_sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Download affected-tests artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: affected-tests-outputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/affected-outputs
        continue-on-error: true

      - name: Check for workspace changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          WORKSPACES_CHANGED=false
          PACKAGES='[]'
          ARTIFACT_VALID=false
          ARTIFACT_BASE_SHA=''
          ARTIFACT_HEAD_SHA=''

          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo 'Fork PR: cloud tests will remain skipped.'
            echo 'workspaces-changed=true' >> "$GITHUB_OUTPUT"
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f /tmp/affected-outputs/base_sha.txt ]; then
            ARTIFACT_BASE_SHA=$(tr -d '[:space:]' < /tmp/affected-outputs/base_sha.txt)
          fi
          if [ -f /tmp/affected-outputs/head_sha.txt ]; then
            ARTIFACT_HEAD_SHA=$(tr -d '[:space:]' < /tmp/affected-outputs/head_sha.txt)
          fi

          git fetch --no-tags --prune origin "$HEAD_SHA" 2>/dev/null || true
          EXPECTED_BASE_SHA=''
          if [ -n "$PR_NUMBER" ]; then
            PR_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref + " " + .base.sha' 2>/dev/null || true)
            PR_BASE_REF=${PR_BASE%% *}
            EXPECTED_BASE_SHA=${PR_BASE#* }
            # Prebuild diffs a stacked PR (based on another PR's branch) against main.
            if [ -n "$PR_BASE" ] && [ "$PR_BASE_REF" != 'main' ] && [ "$PR_BASE_REF" != '0.x' ]; then
              EXPECTED_BASE_SHA=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)
            fi
          fi
          if [ -n "$EXPECTED_BASE_SHA" ]; then
            git fetch --no-tags --prune origin "$EXPECTED_BASE_SHA" 2>/dev/null || true
            DIFF_RANGE="$EXPECTED_BASE_SHA...$HEAD_SHA"
          else
            git fetch --no-tags --prune origin main 2>/dev/null || true
            DIFF_RANGE="origin/main...$HEAD_SHA"
          fi

          # The artifact is created by the unprivileged Prebuild workflow. It is
          # data only, so validate its SHAs and every package name against the
          # PR head before it controls this privileged test matrix.
          if [ \
            "$ARTIFACT_HEAD_SHA" = "$HEAD_SHA" \
            ] && [ \
              -n "$ARTIFACT_BASE_SHA" \
            ] && [ \
              "$ARTIFACT_BASE_SHA" = "$EXPECTED_BASE_SHA" \
            ] && [ \
              -f /tmp/affected-outputs/workspace_packages.json \
            ]; then
            CANDIDATE_PACKAGES=$(tr -d '\r\n' < /tmp/affected-outputs/workspace_packages.json)
            KNOWN_PACKAGES=$(git ls-tree -d --name-only "$HEAD_SHA:workspaces" | grep -v '^_test-utils$' | jq -R -s -c 'split("\n")[:-1]')

            if CANDIDATE_PACKAGES="$CANDIDATE_PACKAGES" KNOWN_PACKAGES="$KNOWN_PACKAGES" node -e '
              const candidate = JSON.parse(process.env.CANDIDATE_PACKAGES);
              const known = new Set(JSON.parse(process.env.KNOWN_PACKAGES));
              if (!Array.isArray(candidate) || candidate.length !== new Set(candidate).size || !candidate.every(item => typeof item === "string" && known.has(item))) process.exit(1);
            '; then
              ARTIFACT_VALID=true
              PACKAGES="$CANDIDATE_PACKAGES"
              if [ "$PACKAGES" != '[]' ]; then
                WORKSPACES_CHANGED=true
              fi
            fi
          fi

          # A valid Prebuild matrix handles source, package, and routing workflow
          # changes. Retain direct-path detection as a fail-closed guard for any
          # artifact that is missing, malformed, stale, or unexpectedly empty.
          DIRECT=$(git diff --name-only \
            "$DIFF_RANGE" \
            | grep -vE '\.md$' \
            | grep -E '^(workspaces/|\.github/workflows/test-workspaces\.yml|\.github/workflows/secrets\.test-workspaces\.yml|\.github/workflows/prebuild\.yml)' \
            || true)

          if [ "$ARTIFACT_VALID" = 'false' ]; then
            ANY_CODE=$(git diff --name-only \
              "$DIFF_RANGE" \
              | grep -vE '\.md$' \
              | grep -vE '^docs/' \
              || true)
            if [ -n "$ANY_CODE" ]; then
              PACKAGES=$(git ls-tree -d --name-only "$HEAD_SHA:workspaces" | grep -v '^_test-utils$' | jq -R -s -c 'split("\n")[:-1]')
              WORKSPACES_CHANGED=true
            fi
          elif [ -n "$DIRECT" ] && [ "$PACKAGES" = '[]' ]; then
            PACKAGES=$(git ls-tree -d --name-only "$HEAD_SHA:workspaces" | grep -v '^_test-utils$' | jq -R -s -c 'split("\n")[:-1]')
            WORKSPACES_CHANGED=true
          fi

          # Test tiers (scripts/test-tiers/select.mjs, from this trusted checkout): skip packages
          # whose job:workspace-cloud/<pkg> is `out` unless the PR touches the package. The
          # versioning PR, the full-tests label, or any problem reading the tiers runs them all.
          if [ "$PACKAGES" != '[]' ] && [ -f scripts/test-tiers/select.mjs ]; then
            TIER_FLAGS=()
            if [[ "$HEAD_BRANCH" == changeset-release/* ]]; then TIER_FLAGS+=(--full-suite); fi
            if [ -n "$PR_NUMBER" ]; then
              if LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name'); then
                if grep -qx 'full-tests' <<< "$LABELS"; then TIER_FLAGS+=(--full-tests-label); fi
              else
                TIER_FLAGS+=(--full-tests-label)
              fi
            fi
            # An empty file (no ci/test-tiers branch) reads as invalid, which skips nothing.
            git fetch --quiet --depth 1 origin ci/test-tiers 2>/dev/null && git show FETCH_HEAD:tiers.json > "$RUNNER_TEMP/tiers.json" || : > "$RUNNER_TEMP/tiers.json"
            # Without a changed-file list the own-path rule can't hold, so skip nothing.
            git diff --name-only "$DIFF_RANGE" > "$RUNNER_TEMP/changed-files.txt" || TIER_FLAGS+=(--full-tests-label)
            mapfile -t CLOUD_KEYS < <(jq -r '.[] | "job:workspace-cloud/" + .' <<< "$PACKAGES")
            if SKIP=$(node scripts/test-tiers/select.mjs skip-jobs --tiers="$RUNNER_TEMP/tiers.json" --changed="$RUNNER_TEMP/changed-files.txt" "${TIER_FLAGS[@]}" "${CLOUD_KEYS[@]}"); then
              PACKAGES=$(jq -c --argjson skip "$SKIP" '[.[] | select(("job:workspace-cloud/" + .) as $k | $skip | index($k) | not)]' <<< "$PACKAGES")
              if [ "$PACKAGES" = '[]' ]; then WORKSPACES_CHANGED=false; fi
            fi
          fi

          echo "workspaces-changed=$WORKSPACES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          {
            echo '## Workspace cloud routing'
            echo
            echo "- Artifact valid: \`$ARTIFACT_VALID\`"
            echo "- Selected packages: \`$PACKAGES\`"
          } >> "$GITHUB_STEP_SUMMARY"

  skip-tests:
    needs: check-changes
    if: needs.check-changes.outputs.workspaces-changed == 'false'
    runs-on: starsling-ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Set success status for unchanged workspaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=success \
            --field context='Workspace Cloud Tests' \
            --field description='Workspace packages unchanged - skipping tests' \
            --field target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  test-cloud:
    needs: check-changes
    if: ${{ github.repository == 'mastra-ai/mastra' && needs.check-changes.outputs.workspaces-changed == 'true' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.check-changes.outputs.packages) }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build packages
        run: pnpm turbo build --filter "@mastra/${{ matrix.package }}"
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Run ${{ matrix.package }} cloud integration tests
        run: pnpm test:cloud
        working-directory: workspaces/${{ matrix.package }}
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          BL_API_KEY: ${{ secrets.BL_API_KEY }}
          BL_WORKSPACE: ${{ secrets.BL_WORKSPACE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}
          TEST_GCS_BUCKET: ${{ secrets.TEST_GCS_BUCKET }}

  test-success:
    needs: [check-changes, test-cloud]
    if: ${{ always() && needs.check-changes.outputs.workspaces-changed == 'true' && needs.test-cloud.result == 'success' }}
    runs-on: starsling-ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Set success status for completed tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=success \
            --field context='Workspace Cloud Tests' \
            --field description='All workspace cloud tests passed' \
            --field target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  test-failure:
    needs: [check-changes, test-cloud]
    if: ${{ always() && needs.check-changes.outputs.workspaces-changed == 'true' && needs.test-cloud.result == 'failure' }}
    runs-on: starsling-ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Set failure status for failed tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=failure \
            --field context='Workspace Cloud Tests' \
            --field description='One or more workspace cloud tests failed' \
            --field target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  test-skipped:
    needs: [check-changes, test-cloud]
    if: ${{ always() && needs.check-changes.outputs.workspaces-changed == 'true' && needs.test-cloud.result == 'skipped' }}
    runs-on: starsling-ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Set status for skipped tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=success \
            --field context='Workspace Cloud Tests' \
            --field description='Cloud tests skipped (fork PR or setup issue)' \
            --field target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
