name: PapersFlow Fork PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fork build, typecheck, and changed tests
    if: github.repository == 'mbenhamd/mastra'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TURBO_CACHE: local:rw
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mastra
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked out PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$HEAD_SHA" ]]; then
            echo "Checked out $actual_head instead of admitted PR head $HEAD_SHA." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0

      - name: Resolve trusted base
        id: trusted-base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # github.event.pull_request.base.sha is pinned when the PR is opened
          # and goes stale as the base branch advances, so validator and policy
          # upgrades on the protected base never reach already-open PRs.
          # Resolve the CURRENT protected-base tip instead: it is exactly as
          # trusted (same protected ref) and strictly fresher. PR code itself
          # remains pinned to the event's exact head SHA above.
          git fetch --no-tags origin "${BASE_REF}"
          echo "sha=$(git rev-parse "origin/${BASE_REF}")" >> "$GITHUB_OUTPUT"

      - name: Classify dependency-graph changes before install
        id: install-policy
        env:
          BASE_SHA: ${{ steps.trusted-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          script_path=".github/scripts/run-papersflow-fork-pr-validation.bash"
          trusted_script="${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          /usr/bin/git show "${BASE_SHA}:${script_path}" > "$trusted_script"

          pf4163_policy_script="${RUNNER_TEMP}/pf4163-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf4163-upstream-sync' "$trusted_script"; then
            cp "$trusted_script" "$pf4163_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-4163-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-4163 exact-merge fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf4163_policy_script"
          else
            echo 'The trusted base does not contain the PF-4163 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf4163_policy_script" --self-test-pf4163-upstream-sync

          if grep -Fq -- '--classify-install' "$trusted_script"; then
            /bin/bash "$trusted_script" --classify-install
          else
            # One-time bootstrap for this policy PR. The protected base still
            # owns the previous fail-closed rule and this PR does not change a
            # dependency manifest.
            mapfile -t manifest_changes < <(
              git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}" -- \
                .npmrc .pnpmfile.cjs pnpmfile.cjs package.json \
                pnpm-workspace.yaml patches packages/server/package.json
            )
            if (( ${#manifest_changes[@]} > 0 )); then
              echo "These dependency-graph changes require dedicated validation and are rejected before install:" >&2
              printf '%s\n' "${manifest_changes[@]}" >&2
              exit 1
            fi
            echo 'lane=standard' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          VALIDATION_LANE: ${{ steps.install-policy.outputs.lane }}
        run: |
          if [[ "$VALIDATION_LANE" == 'pf558-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf2009-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf2247-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf3020-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf4051-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf3375-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf4163-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf2576-upstream-sync' || \
            "$VALIDATION_LANE" == 'pf2045-upstream-sync' ]]; then
            # Nested workspace manifests are part of the reconciled source
            # tree, not part of the exact pre-install allowlist. Suppress all
            # lifecycle scripts; validation executes only the explicit commands
            # selected by the trusted-base script below.
            pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts
          else
            pnpm install --frozen-lockfile
          fi

      - name: Exercise upstream-sync admission policies
        env:
          BASE_SHA: ${{ steps.trusted-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          script_path=".github/scripts/run-papersflow-fork-pr-validation.bash"
          policy_script="${RUNNER_TEMP}/pf558-policy-self-test.bash"
          /usr/bin/git show "${BASE_SHA}:${script_path}" > "$policy_script"
          if grep -Fq -- '--self-test-pf558-upstream-sync' "$policy_script"; then
            : # The protected base owns the policy fixtures.
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-558-upstream-sync-validation' ]]; then
            echo 'Bootstrapping the PF-558 policy fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$policy_script"
          else
            echo 'The trusted base does not contain the PF-558 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$policy_script" --self-test-pf558-upstream-sync

          pf2009_policy_script="${RUNNER_TEMP}/pf2009-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf2009-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf2009_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$PR_NUMBER" == '278' && \
            "$HEAD_REF" == 'ci/pf-2009-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-2009 policy fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf2009_policy_script"
          else
            echo 'The trusted base does not contain the PF-2009 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf2009_policy_script" --self-test-pf2009-upstream-sync

          pf2045_policy_script="${RUNNER_TEMP}/pf2045-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf2045-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf2045_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-2044-owned-validation-targets' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-2045 topology/tree fixtures from the PF-2044 policy branch.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf2045_policy_script"
          else
            echo 'The trusted base does not contain the PF-2045 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf2045_policy_script" --self-test-pf2045-upstream-sync

          pf2247_policy_script="${RUNNER_TEMP}/pf2247-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf2247-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf2247_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-2247-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-2247 exact-merge fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf2247_policy_script"
          else
            echo 'The trusted base does not contain the PF-2247 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf2247_policy_script" --self-test-pf2247-upstream-sync

          pf2576_policy_script="${RUNNER_TEMP}/pf2576-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf2576-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf2576_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-2576-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-2576 exact-merge fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf2576_policy_script"
          else
            echo 'The trusted base does not contain the PF-2576 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf2576_policy_script" --self-test-pf2576-upstream-sync

          pf3375_policy_script="${RUNNER_TEMP}/pf3375-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf3375-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf3375_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-3375-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-3375 exact-merge fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf3375_policy_script"
          else
            echo 'The trusted base does not contain the PF-3375 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf3375_policy_script" --self-test-pf3375-upstream-sync

          pf4051_policy_script="${RUNNER_TEMP}/pf4051-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf4051-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf4051_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-4051-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-4051 exact-merge fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf4051_policy_script"
          else
            echo 'The trusted base does not contain the PF-4051 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf4051_policy_script" --self-test-pf4051-upstream-sync
          /bin/bash "$pf4051_policy_script" --self-test-package-contracts

          pf3020_policy_script="${RUNNER_TEMP}/pf3020-policy-self-test.bash"
          if grep -Fq -- '--self-test-pf3020-upstream-sync' "$policy_script"; then
            cp "$policy_script" "$pf3020_policy_script"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$HEAD_REF" == 'ci/pf-3020-upstream-sync-validation' && \
            "$BASE_REF" == 'main' ]]; then
            echo 'Bootstrapping the PF-3020 exact-merge fixtures from this same-repository policy PR.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" > "$pf3020_policy_script"
          else
            echo 'The trusted base does not contain the PF-3020 admission fixtures.' >&2
            exit 1
          fi
          /bin/bash "$pf3020_policy_script" --self-test-pf3020-upstream-sync

      - name: Start Redis test service
        run: |
          docker run --detach --name mastra-fork-redis --publish 6380:6379 \
            redis:8-alpine redis-server --requirepass redis_password
          for _attempt in {1..30}; do
            if docker exec mastra-fork-redis redis-cli -a redis_password ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastra-fork-redis
          exit 1

      - name: Start Redis Streams test service when owned
        env:
          BASE_SHA: ${{ steps.trusted-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- pubsub/redis-streams; then
            echo 'Redis Streams workspace unchanged; no port 6381 service required.'
            exit 0
          fi
          docker run --detach --name mastra-fork-redis-streams --publish 6381:6379 \
            redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
          for _attempt in {1..30}; do
            if docker exec mastra-fork-redis-streams redis-cli ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastra-fork-redis-streams
          exit 1

      - name: Start Google Cloud PubSub emulator when owned
        env:
          BASE_SHA: ${{ steps.trusted-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- pubsub/google-cloud-pubsub; then
            echo 'Google Cloud PubSub workspace unchanged; no emulator required.'
            exit 0
          fi
          docker run --detach --name mastra-fork-pubsub-emulator --publish 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:873834701bc92f5fd5052cd5f5e572246caaf24b3e3b79e741ba1b29f7a291c6 \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
          for _attempt in {1..60}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8085' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastra-fork-pubsub-emulator
          exit 1

      - name: Validate fork PR
        env:
          BASE_SHA: ${{ steps.trusted-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_LANE: ${{ steps.install-policy.outputs.lane }}
        run: |
          script_path=".github/scripts/run-papersflow-fork-pr-validation.bash"
          workflow_path=".github/workflows/papersflow-fork-pr.yml"
          # This exact same-repository policy PR is the sole bootstrap for this
          # incremental validator update. Every other PR uses the protected
          # base copy, including any later reuse of this branch name.
          # The literal placeholder is deliberately fail-closed: until the
          # draft PR exists and its numeric ID replaces this token, selecting
          # the protected base would hide the new validator self-tests.
          policy_pr_placeholder='__PF4243_POLICY_PR_NUMBER''__'
          if [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${HEAD_REF}" == 'codex/pf-4243-pg-index-unit-validation' && \
            "${BASE_REF}" == 'main' ]] && \
            grep -Fq -- "$policy_pr_placeholder" "$workflow_path"; then
            echo 'PF-4243 policy branch still contains its unbound PR-number placeholder; failing closed before protected-base fallback.' >&2
            exit 1
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${PR_NUMBER}" == '__PF4243_POLICY_PR_NUMBER__' && \
            "${HEAD_REF}" == 'codex/pf-4243-pg-index-unit-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the validator from the exact PF-4243 PostgreSQL performance-unit policy PR placeholder.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${PR_NUMBER}" == '391' && \
            "${HEAD_REF}" == 'ci/pf-3911-package-contract-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the validator from exact PF-3911 policy PR #391.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${PR_NUMBER}" == '380' && \
            "${HEAD_REF}" == 'ci/pf-3580-dependency-triggered-supervisor-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the validator from exact PF-3580 policy PR #380.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${PR_NUMBER}" == '375' && \
            "${HEAD_REF}" == 'ci/pf-3557-selected-route-export-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the validator from exact PF-3557 policy PR #375.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${HEAD_REF}" == 'ci/pf-2247-upstream-sync-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the validator from the exact PF-2247 policy branch.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${HEAD_REF}" == 'ci/pf-2044-owned-validation-targets' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the validator from the exact PF-2044 policy branch.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif /usr/bin/git cat-file -e "${BASE_SHA}:${script_path}" && \
            /usr/bin/git show "${BASE_SHA}:${script_path}" | \
              grep -Fq -- '--self-test-pf2045-upstream-sync'; then
            /usr/bin/git show "${BASE_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${PR_NUMBER}" == '278' && \
            "${HEAD_REF}" == 'ci/pf-2009-upstream-sync-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            echo 'Bootstrapping the PF-2009 validator from this exact same-repository policy branch.'
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif /usr/bin/git cat-file -e "${BASE_SHA}:${script_path}"; then
            /usr/bin/git show "${BASE_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          elif [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "Bootstrapping the validator from this same-repository PR."
            /usr/bin/git show "${HEAD_SHA}:${script_path}" \
              > "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
          else
            echo "The trusted base commit does not contain the fork validator." >&2
            exit 1
          fi
          # Exercise the exact trusted script selected above before it decides
          # coverage for this PR. The fixture suite is isolated and resets the
          # validator's per-invocation time budget.
          /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" --self-test
          packed_check_path=".github/scripts/check-packed-declaration-fixture.mjs"
          packed_check_revision="${BASE_SHA}"
          if [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" && \
            "${PR_NUMBER}" == '391' && \
            "${HEAD_REF}" == 'ci/pf-3911-package-contract-validation' && \
            "${BASE_REF}" == 'main' ]]; then
            packed_check_revision="${HEAD_SHA}"
          fi
          /usr/bin/git show "${packed_check_revision}:${packed_check_path}" \
            > "${RUNNER_TEMP}/check-packed-declaration-fixture.mjs"
          node "${RUNNER_TEMP}/check-packed-declaration-fixture.mjs" --self-test
          case "$VALIDATION_LANE" in
            pf558-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf558-upstream-sync
              ;;
            pf2009-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf2009-upstream-sync
              ;;
            pf2045-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf2045-upstream-sync
              ;;
            pf2247-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf2247-upstream-sync
              ;;
            pf3020-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf3020-upstream-sync
              ;;
            pf2576-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf2576-upstream-sync
              ;;
            pf3375-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf3375-upstream-sync
              ;;
            pf4163-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf4163-upstream-sync
              ;;
            pf4051-upstream-sync)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash" \
                --validate-pf4051-upstream-sync
              ;;
            *)
              /bin/bash "${RUNNER_TEMP}/run-papersflow-fork-pr-validation.bash"
              ;;
          esac
