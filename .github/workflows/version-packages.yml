name: Version Packages

permissions:
  contents: read

on:
  push:
    branches:
      - main

# Only the newest main matters: a newer run rebuilds or closes the release PR from it, so an
# older run must never finish after it and push a release branch built from stale main.
concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    # Only run on the main repository, not on forks
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    steps:
      - name: Initial checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          # Use default GITHUB_TOKEN for initial checkout
          # This is needed to access the .github/actions/app-auth action
          fetch-depth: 1
          persist-credentials: false

      - name: Dane App Auth
        id: app-auth
        uses: ./.github/actions/app-auth
        with:
          client-id: ${{ vars.DANE_CLIENT_ID }}
          private-key: ${{ secrets.DANE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Re-checkout with app token
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          token: ${{ steps.app-auth.outputs.token }}
          # Fetch entire git history so Changesets can generate changelogs
          # with the correct commits
          fetch-depth: 0
          # Partial clone: changelogs need commits and trees, not every historical
          # file version. Cuts the full-history fetch from minutes to seconds.
          filter: blob:none
          persist-credentials: true

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Determine prerelease tag
        id: determine-tag
        run: |
          echo "tag=alpha" >> $GITHUB_OUTPUT

      - name: Bump mcp-docs-server prerelease version
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          # husky precommit runs linting and typechecking - those are handled by other GH actions already
          HUSKY: 0
        run: |
          cd packages/mcp-docs-server
          pnpm version prerelease --preid ${{ steps.determine-tag.outputs.tag }} --no-git-tag-version
          cd ../..
          git add packages/mcp-docs-server/package.json
          git commit -m "chore: bump @mastra/mcp-docs-server prerelease version"

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        env:
          GITHUB_TOKEN: ${{ steps.app-auth.outputs.token }}
          # husky precommit runs linting and typechecking - those are handled by other GH actions already
          HUSKY: 0
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm changeset-cli version

      # Cron Alpha Version versions changesets directly on main. Afterwards no changesets are
      # left to release, so changesets/action leaves the old release PR alone, and it conflicts
      # with main. Deleting the branch closes that PR; the next push with a changeset reopens it.
      - name: Close stale release PR
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" > /dev/null; then
            git push origin --delete "${RELEASE_BRANCH}"
          else
            echo "No ${RELEASE_BRANCH} branch to delete"
          fi
