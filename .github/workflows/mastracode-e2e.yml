name: Mastra Code E2E

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

permissions: {}

jobs:
  mastracode-e2e:
    name: Mastra Code E2E
    runs-on: starsling-ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build Mastra Code
        run: pnpm run build:mastracode

      - name: Typecheck Code SDK
        run: pnpm --filter @mastra/code-sdk check

      - name: Run ACP unit tests
        run: pnpm --filter @mastra/code-sdk test:acp

      - name: Check built SDK ACP conformance
        run: pnpm --filter @mastra/code-sdk test:acp:conformance

      - name: Upload ACP conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acp-conformance
          path: |
            mastracode/sdk/node_modules/.acp-conformance/report/
            mastracode/sdk/node_modules/.acp-conformance/schema-source.json
          include-hidden-files: true
          retention-days: 14

      - name: Run Mastra Code E2E
        run: pnpm --filter ./mastracode/tui run e2e:test -- --reporter=dot
