name: Changed Test Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-tests:
    # This workflow runs PR code in the unprivileged pull_request sandbox, without
    # secrets or write permissions.
    if: ${{ github.repository == 'mastra-ai/mastra' && github.event.pull_request.draft == false }}
    runs-on: starsling-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout base
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Restore changed test files from PR head
        id: changed_tests
        shell: bash
        run: |
          set -euo pipefail

          # Fetch the complete PR ancestry so the merge base is available. A direct
          # base-to-head diff reports base-only changes as PR deletions when the
          # branch is behind the base branch. Keep the PR head as a blobless
          # promisor remote so checkout can lazily retrieve PR-only test blobs.
          git remote add pr-head "${HEAD_REPO}"
          git config remote.pr-head.promisor true
          git config remote.pr-head.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none pr-head "${HEAD_SHA}"
          merge_base="$(git merge-base "${BASE_SHA}" FETCH_HEAD)"
          git diff --name-only --diff-filter=ACMRT "${merge_base}" FETCH_HEAD \
            | sort > /tmp/changed-files
          git diff --no-renames --name-only --diff-filter=ACMRTD "${merge_base}" FETCH_HEAD \
            | sort > /tmp/changed-coverage-files

          # Deployer changes must include monorepo E2E coverage. This rule runs
          # before the no-test exemptions below so it applies to all contributors.
          # Keep this list separate from /tmp/changed-files so deleted tests are
          # not restored from FETCH_HEAD. The package instructions and the
          # generated changelog are exempt, and the automated Changesets release
          # PR is skipped entirely: it only bumps versions and changelogs, so it
          # can never add the E2E coverage this rule asks for. The branch name
          # alone is not a trusted signal, since a fork can pick any name, so the
          # skip also requires the head to live in this repository.
          if [ "$HEAD_REPO_FULL_NAME" = "$BASE_REPOSITORY" ] \
            && [ "${HEAD_REF#changeset-release/}" != "$HEAD_REF" ]; then
            echo "Skipping deployer E2E coverage rule for the Changesets release PR."
          elif grep -q '^packages/deployer/' /tmp/changed-coverage-files \
            && ! grep -q '^e2e-tests/monorepo/' /tmp/changed-coverage-files \
            && awk '$0 ~ /^packages\/deployer\// && $0 != "packages/deployer/AGENTS.md" && $0 != "packages/deployer/CHANGELOG.md" { found=1; exit } END { exit(found ? 0 : 1) }' \
              /tmp/changed-coverage-files; then
            first_deployer_file="$(
              awk '$0 ~ /^packages\/deployer\// && $0 != "packages/deployer/AGENTS.md" && $0 != "packages/deployer/CHANGELOG.md" { print; exit }' \
                /tmp/changed-coverage-files
            )"
            escaped_deployer_file="${first_deployer_file//%/%25}"
            escaped_deployer_file="${escaped_deployer_file//$'\r'/%0D}"
            escaped_deployer_file="${escaped_deployer_file//$'\n'/%0A}"
            escaped_deployer_file="${escaped_deployer_file//:/%3A}"
            escaped_deployer_file="${escaped_deployer_file//,/%2C}"
            echo "::error file=${escaped_deployer_file},title=Monorepo E2E coverage required::This PR changes packages/deployer/ but has no corresponding changes under e2e-tests/monorepo/. Deployer unit tests alone do not validate generated monorepo applications — add or update a monorepo E2E test. See packages/deployer/AGENTS.md for commands."
            exit 1
          fi

          grep -E '(^|/)(test|tests|__tests__)/|\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$|\.test-d\.ts$' \
            /tmp/changed-files | sort > /tmp/changed-test-files || true

          if [ ! -s /tmp/changed-test-files ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"

            if [ "$HEAD_REPO_FULL_NAME" = "$BASE_REPOSITORY" ]; then
              echo "No changed test files detected for a branch in the base repository."
              exit 0
            fi

            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR)
                echo "No changed test files detected for an official contributor."
                exit 0
                ;;
              *)
                echo "::error::No changed test files detected. External contributors should add or update tests."
                exit 1
                ;;
            esac
          fi

          while IFS= read -r file; do
            git checkout FETCH_HEAD -- "$file"
          done < /tmp/changed-test-files

          echo "has_tests=true" >> "$GITHUB_OUTPUT"
          echo "Changed test files:"
          cat /tmp/changed-test-files
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm and Node.js
        if: ${{ steps.changed_tests.outputs.has_tests == 'true' }}
        uses: ./.github/actions/setup-pnpm-node

      - name: Build
        if: ${{ steps.changed_tests.outputs.has_tests == 'true' }}
        env:
          TURBO_CACHE: local:rw
          NODE_OPTIONS: --max-old-space-size=8192
        # @mastra/mcp-docs-server#build depends on mastra-docs#build, which
        # runs `git log --name-status` across the repo. In this blobless,
        # credential-less checkout that lazy-fetches blobs and fails. Nothing
        # else depends on it, so leave it out of the gate build.
        run: pnpm turbo --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*" --filter "!@mastra/mcp-docs-server" build

      - name: Run changed tests against base
        if: ${{ steps.changed_tests.outputs.has_tests == 'true' }}
        shell: bash
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          mapfile -t test_files < /tmp/changed-test-files

          # New packages do not have their package or Vitest config on the base
          # branch. Restore only the missing test support files after the base
          # build so Vitest can discover the changed tests without adding the
          # incomplete package to the build graph.
          for file in "${test_files[@]}"; do
            search_dir="$(dirname "$file")"

            while [ "$search_dir" != "." ] && [ "$search_dir" != "/" ]; do
              for support_file in package.json vitest.config.ts vitest.config.mts; do
                candidate="$search_dir/$support_file"
                if [ ! -f "$candidate" ] && git cat-file -e "FETCH_HEAD:$candidate" 2>/dev/null; then
                  git checkout FETCH_HEAD -- "$candidate"
                  echo "Restored test support file: $candidate"
                fi
              done

              if [ -f "$search_dir/package.json" ]; then
                break
              fi

              search_dir="$(dirname "$search_dir")"
            done
          done

          # --silent=true: in Vitest 4, a bare --silent consumes the following
          # positional test-file argument and errors out, false-greening the gate.
          vitest_args=(run --passWithNoTests --reporter=dot --silent=true)
          root_test_files=()
          test_status=0

          for file in "${test_files[@]}"; do
            test_dir=""
            search_dir="$(dirname "$file")"

            while [ "$search_dir" != "." ] && [ "$search_dir" != "/" ]; do
              if [ -f "$search_dir/vitest.config.ts" ] || [ -f "$search_dir/vitest.config.mts" ]; then
                test_dir="$search_dir"
                break
              fi

              search_dir="$(dirname "$search_dir")"
            done

            if [ -n "$test_dir" ]; then
              relative_file="${file#"$test_dir"/}"

              set +e
              pnpm --dir "$test_dir" exec vitest "${vitest_args[@]}" "$relative_file"
              status=$?
              set -e

              if [ "$status" -ne 0 ]; then
                test_status="$status"
              fi
            else
              root_test_files+=("$file")
            fi
          done

          set +e
          if [ "${#root_test_files[@]}" -gt 0 ]; then
            pnpm vitest "${vitest_args[@]}" "${root_test_files[@]}"
            status=$?
            if [ "$status" -ne 0 ]; then
              test_status="$status"
            fi
          fi
          set -e

          if [ "$test_status" -eq 0 ]; then
            echo "::error::Changed tests passed against the base branch. They should fail before the PR code is applied."
            exit 1
          fi

          echo "Changed tests failed against the base branch as expected."
