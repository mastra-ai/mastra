name: CodeQL

# Replaces GitHub's "default setup" scan, which ran on every PR and was the longest
# check (median ~25 min). PRs are no longer scanned: a PR scan only reports alerts on
# the lines that PR changed, while scans of main are what fill the Security tab. This
# scans main twice a day (and on demand) and posts to Slack when the scan finds new
# open alerts on main, or when the scan itself fails.
# Default setup must be switched off in Settings > Code security before this merges;
# GitHub refuses to run both.

on:
  schedule:
    - cron: '41 3 * * *'
    - cron: '41 15 * * *'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'mastra-ai/mastra'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Same languages as the default setup it replaces; `actions` scans the workflows themselves.
        language: [javascript-typescript, actions]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}

  notify:
    name: Notify Slack of CodeQL results
    needs: analyze
    # Only scans of main in this repository alert; a manual run on another branch does not.
    if: always() && github.repository == 'mastra-ai/mastra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - name: Compare with the previous scan of main
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.analyze.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERTS_URL: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch%3Amain+tool%3ACodeQL
        run: |
          # A cancelled scan was stopped by hand; leave the alert state unchanged.
          if [ "$RESULT" = "cancelled" ] || [ "$RESULT" = "skipped" ]; then
            echo "Scan was $RESULT; not alerting."
            exit 0
          fi

          # Prints "<analyze> <notified>" for a run or attempt: analyze is failure, success, or
          # ignored when it was cancelled or unreadable; notified is yes when its notify job
          # passed, which means it read the alerts it was due to report.
          run_state() {
            local jobs conclusions analyze=ignored notified=no
            if ! jobs=$(gh api --paginate "$1/jobs?per_page=100" \
              --jq '.jobs[] | "\(.name)\t\(.conclusion)"' 2>/dev/null); then
              echo "ignored no"
              return 0
            fi
            conclusions=$(awk -F'\t' '$1 ~ /^Analyze/ {print $2}' <<< "$jobs")
            if grep -qxE 'failure|timed_out' <<< "$conclusions"; then
              analyze=failure
            elif [ -n "$conclusions" ] && ! grep -qx cancelled <<< "$conclusions"; then
              analyze=success
            fi
            if awk -F'\t' '$1 == "Notify Slack of CodeQL results" && $2 == "success" {found=1} END {exit !found}' <<< "$jobs"; then
              notified=yes
            fi
            echo "$analyze $notified"
          }

          # Earlier attempts of this run come first (a re-run keeps its run ID), then earlier
          # scans of main, newest first.
          base="repos/$GITHUB_REPOSITORY/actions/runs"
          candidates=''
          for ((attempt = GITHUB_RUN_ATTEMPT - 1; attempt >= 1; attempt--)); do
            ended=$(gh api "$base/$GITHUB_RUN_ID/attempts/$attempt" --jq .updated_at 2>/dev/null) || ended=''
            candidates+="$base/$GITHUB_RUN_ID/attempts/$attempt $ended"$'\n'
          done
          runs_read=true
          if runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs" \
            -f branch=main -f status=completed -F per_page=30 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | \"$base/\(.id) \(.updated_at)\""); then
            candidates+="$runs"$'\n'
          else
            echo "::warning::Could not read earlier scans."
            runs_read=false
          fi

          # The newest finished scan gives the previous state, for failure and recovery alerts.
          # The cutoff for "new" alerts is the end of the newest scan that fully passed and whose
          # notify job read the alerts: anything created after it has not been reported yet.
          previous=''
          since=''
          while read -r path ended; do
            [ -n "$path" ] || continue
            read -r analyze notified <<< "$(run_state "$path")"
            case "$analyze" in success | failure) ;; *) continue ;; esac
            previous=${previous:-$analyze}
            if [ "$analyze" = "success" ] && [ "$notified" = "yes" ] && [ -n "$ended" ]; then
              since=$ended
              break
            fi
          done <<< "$candidates"
          if [ -z "$previous" ]; then
            if [ "$runs_read" = "true" ]; then previous=none; else previous=unknown; fi
          fi
          echo "Previous scan: $previous; new alerts counted from: ${since:-n/a}; this scan: $RESULT"

          # When this scan passed but its alerts could not be checked, this job fails so the
          # next scan does not use this one as its cutoff and reports them instead.
          checked=true
          lines=()
          if [ "$RESULT" != "success" ]; then
            if [ "$previous" != "failure" ]; then
              lines+=(":rotating_light: The CodeQL scan of main failed. <$RUN_URL|View the run>.")
            fi
          else
            if [ "$previous" = "failure" ]; then
              lines+=(":white_check_mark: The CodeQL scan of main is passing again.")
            fi
            if [ "$runs_read" != "true" ]; then
              checked=false
            # With no earlier scan to compare against, the first scan only sets the cutoff.
            elif [ -n "$since" ]; then
              if new=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
                -f ref=refs/heads/main -f state=open -f tool_name=CodeQL -F per_page=100 \
                --jq ".[] | select(.created_at > \"$since\") | .number"); then
                count=$(grep -c . <<< "$new" || true)
                echo "New open alerts on main since $since: $count"
                if [ "$count" -gt 0 ]; then
                  lines+=(":rotating_light: CodeQL found $count new open alert(s) on main. <$ALERTS_URL|Review them>.")
                fi
              else
                echo "::warning::Could not read code scanning alerts."
                checked=false
              fi
            fi
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"

          if [ "${#lines[@]}" -eq 0 ]; then
            echo "No change since the previous scan; not alerting."
            exit 0
          fi
          printf 'text=%s\n' "${lines[*]}" >> "$GITHUB_OUTPUT"

      - name: Checkout Slack action
        if: steps.state.outputs.text != ''
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Post to Slack
        if: steps.state.outputs.text != ''
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: ${{ steps.state.outputs.text }}
          # #eng-maintainer-alerts
          channel: 'C0CD83YFFNF'
          # An undelivered alert fails this job, so this scan is not used as the cutoff
          # for "new" alerts and the next scan reports them again.
          strict: 'true'

      - name: Fail when the alerts could not be checked
        if: steps.state.outputs.checked == 'false'
        run: |
          echo "::error::Could not read earlier scans or code scanning alerts; the next scan will report any new alerts."
          exit 1
