name: CodeQL

# Replaces GitHub's "default setup" scan, which ran on every PR and was the longest
# check (median ~25 min). The scan now runs on the Changesets release PR and weekly.
# Default setup must be switched off in Settings > Code security before this merges;
# GitHub refuses to run both.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: codeql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # A fork can pick any branch name, so the release PR head must also live in this repository
    # (same guard as prebuild.yml and lint.yml).
    if: >-
      github.repository == 'mastra-ai/mastra' &&
      (github.event_name == 'schedule' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'changeset-release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Same languages as the default setup it replaces; `actions` scans the workflows themselves.
        language: [javascript-typescript, actions]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
