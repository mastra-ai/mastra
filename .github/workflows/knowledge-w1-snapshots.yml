name: Knowledge W1 snapshot layouts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - latest
          - alpha
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 22
      - name: Start services
        run: |
          (cd stores/pg && docker compose up -d --wait)
          (cd stores/mysql && docker compose up -d --wait)
          (cd stores/mongodb && docker compose up -d --wait mongodb-storage)
      - name: Install snapshot
        run: |
          mkdir -p /tmp/proj out && cp .github/knowledge-w1-snapshots/dump.mjs /tmp/proj/
          cd /tmp/proj && npm init -y >/dev/null
          V='${{ matrix.version }}'
          if [ "$V" = latest ] || [ "$V" = alpha ]; then
            for p in core libsql pg mysql mongodb; do echo "@mastra/$p@$(npm view @mastra/$p dist-tags.$V)"; done > specs
          else
            for p in core libsql pg mysql mongodb; do echo "@mastra/$p@$V"; done > specs
          fi
          cat specs
          npm install --legacy-peer-deps --no-audit --no-fund $(cat specs) @libsql/client pg mysql2 mongodb
          npm ls @mastra/core @mastra/libsql @mastra/pg @mastra/mysql @mastra/mongodb > "$GITHUB_WORKSPACE/out/${{ matrix.version }}.versions.txt" || true
      - name: Dump
        run: cd /tmp/proj && node dump.mjs "$GITHUB_WORKSPACE/out" '${{ matrix.version }}'
      - name: DDL dumps
        run: |
          V='${{ matrix.version }}'
          S=$(echo "s_$V" | sed 's/[^a-zA-Z0-9]/_/g' | tr 'A-Z' 'a-z')
          docker exec pg-test-db pg_dump -U postgres -d mastra --schema-only --no-owner --no-privileges -n "$S" > "out/$V.pg.sql"
          sqlite3 "/tmp/$V.db" .schema > "out/$V.libsql.sql"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: layout-${{ matrix.version }}
          path: out/
