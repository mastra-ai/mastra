name: Quality assurance

on:
  # No base-branch filter: a stacked PR (based on another PR's branch) gets the same
  # checks it would on main, diffed against main (see "Check for code changes").
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect code changes
    runs-on: starsling-ubuntu-26.04-2
    permissions:
      contents: read
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
      base_sha: ${{ steps.filter.outputs.base_sha }}
      has_examples: ${{ steps.filter.outputs.has_examples }}
      has_agents_inputs: ${{ steps.filter.outputs.has_agents_inputs }}
      has_peerdeps_inputs: ${{ steps.filter.outputs.has_peerdeps_inputs }}
      has_readme_inputs: ${{ steps.filter.outputs.has_readme_inputs }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Check for code changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A stacked PR merges into another PR's branch, but its code ends up on main, so
          # check it against main.
          BASE_SHA=$PR_BASE_SHA
          if [ "$BASE_REF" != "main" ] && [ "$BASE_REF" != "0.x" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
            echo "Stacked on $BASE_REF; diffing against main at $BASE_SHA."
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          ALL=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          CODE=$(echo "$ALL" | grep -vE '^(docs/|examples/|\.changeset/|explorations/)' || true)
          if [ -n "$CODE" ]; then
            echo "has_code=true" >> $GITHUB_OUTPUT
          else
            echo "has_code=false" >> $GITHUB_OUTPUT
          fi

          EXAMPLES=$(echo "$ALL" | grep -E '^examples/' || true)
          if [ -n "$EXAMPLES" ]; then
            echo "has_examples=true" >> $GITHUB_OUTPUT
          else
            echo "has_examples=false" >> $GITHUB_OUTPUT
          fi

          printf '%s\n' "$ALL" > /tmp/changed-files.txt
          node --input-type=module -e '
            import fs from "node:fs";
            import { qualityAssuranceInputs } from "./.github/scripts/ci-routing.cjs";
            import { discoverPackages, findPackagesMissingDocs } from "./.github/scripts/check-package-readmes.mjs";
            const changedFiles = fs.readFileSync("/tmp/changed-files.txt", "utf8").split(/\r?\n/).filter(Boolean);
            const packageReadmePaths = discoverPackages(process.cwd()).map(pkg => `${pkg.relativeDirectory}/README.md`);
            const packagesMissingDocs = findPackagesMissingDocs(process.cwd());
            const { hasAgentsInputs, hasPeerdepsInputs, hasReadmeInputs, agentsReasons, peerdepsReasons, readmeReasons, missingPackageDocs } = qualityAssuranceInputs(changedFiles, packageReadmePaths, packagesMissingDocs);
            const formatReasons = reasons => reasons.length === 0 ? "no relevant changed paths" : reasons.map(path => `\`${path}\``).join(", ");
            const formatMissingDocs = packages => packages.length === 0 ? "none" : packages.map(pkg => `\`${pkg.relativeDirectory}\` (missing ${pkg.missing.join(", ")})`).join(", ");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_agents_inputs=${hasAgentsInputs}\nhas_peerdeps_inputs=${hasPeerdepsInputs}\nhas_readme_inputs=${hasReadmeInputs}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Quality assurance routing\n\n- AGENTS validation: \`${hasAgentsInputs}\` — ${formatReasons(agentsReasons)}\n- Peer dependency validation: \`${hasPeerdepsInputs}\` — ${formatReasons(peerdepsReasons)}\n- README validation: \`${hasReadmeInputs}\` — ${formatReasons(readmeReasons)}; packages missing docs: ${formatMissingDocs(missingPackageDocs)}\n`);
          '

  changeset-check:
    name: Validate changeset packages
    needs: changes
    runs-on: starsling-ubuntu-26.04-2
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          # Changesets resolves the merge-base with main.
          fetch-depth: 0
          # Partial clone: full history without every historical file version.
          filter: blob:none
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      # Test tiers (scripts/test-tiers/select.mjs): the validator's own tests are tiered as
      # job:qa/changeset-check. The checks of this PR's changesets below always run.
      - name: Check test tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          FLAGS=()
          if [[ "$HEAD_REF" == changeset-release/* ]]; then FLAGS+=(--full-suite); fi
          if jq -e 'index("full-tests")' <<< "$LABELS" > /dev/null; then FLAGS+=(--full-tests-label); fi
          # An empty file (no ci/test-tiers branch) reads as invalid, which skips nothing.
          git fetch --quiet --depth 1 origin ci/test-tiers 2>/dev/null && git show FETCH_HEAD:tiers.json > "$RUNNER_TEMP/tiers.json" || : > "$RUNNER_TEMP/tiers.json"
          # Without a changed-file list the own-path rule can't hold, so skip nothing.
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt" || FLAGS+=(--full-tests-label)
          SKIP=$(node scripts/test-tiers/select.mjs skip-jobs --tiers="$RUNNER_TEMP/tiers.json" --changed="$RUNNER_TEMP/changed-files.txt" "${FLAGS[@]}" job:qa/changeset-check) || SKIP='[]'
          echo "skip=$(jq 'length > 0' <<< "$SKIP")" >> "$GITHUB_OUTPUT"

      - name: Test changeset package validator
        if: ${{ steps.tier.outputs.skip != 'true' }}
        run: node --test .github/scripts/check-changeset-packages.test.mjs

      # Check all pending changesets, including on changeset-only PRs.
      - name: Reject unknown or ignored changeset packages
        run: node .github/scripts/check-changeset-packages.mjs

      # Whether a change needs a release is the author's call, so a PR that adds
      # no changeset has nothing for `changeset status` to check: the pending
      # changesets are already on main and were validated on the PRs that added
      # them. This also covers the automated Changesets release PR, which only
      # deletes changesets.
      - name: Check whether this PR adds changesets
        id: pr-changesets
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --no-renames --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- '.changeset/*.md' | grep -qv '^\.changeset/README\.md$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # actions/checkout fetches main as origin/main, not a local main branch.
      - name: Validate changeset release plan
        if: ${{ steps.pr-changesets.outputs.found == 'true' }}
        run: pnpm changeset-cli status --since origin/main

  new-package-npm-check:
    name: New packages exist on npm
    runs-on: starsling-ubuntu-24.04-2
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          # The check diffs against the PR base branch.
          fetch-depth: 0
          # Partial clone: the check runs `git diff --name-only`, which reads
          # trees only, so historical file versions are never needed.
          filter: blob:none
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          # The check only needs pnpm workspace discovery, git and network.
          install-dependencies: 'false'

      - name: Test npm package existence check, publish and placeholder scripts
        run: node --test .github/scripts/check-npm-packages-exist.test.mjs .github/scripts/publish-packages.test.mjs scripts/npm-placeholder-publish.test.mjs

      - name: Test the test-tier scripts
        run: node --test scripts/test-tiers/*.test.mjs

      # npm-publish.yml publishes with npm trusted publishing (OIDC) and has no
      # token fallback, and npm only allows a trusted publisher on a package
      # that already exists — a brand-new package fails mid-publish. Fail here
      # instead, with the recovery instructions.
      #
      # The automated Changesets release PR is what the next publish consumes,
      # so check every publishable package on it. Other PRs only check packages
      # whose package.json they add or change (new packages, private→public
      # promotions); PRs that touch no package.json make no registry calls.
      - name: Fetch base branch
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          # Stacked PRs compare against main, like every other check here.
          BASE_REF: ${{ (github.base_ref == 'main' || github.base_ref == '0.x') && github.base_ref || 'main' }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      # PR-controlled values (head_ref, base_ref) stay out of `run:` scripts:
      # the routing lives in `if:` and the base ref reaches bash via `env:`.
      - name: Fail on publishable packages missing from npm (release PR, all packages)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/') }}
        run: node .github/scripts/check-npm-packages-exist.mjs

      - name: Fail on publishable packages missing from npm (changed packages)
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          # Stacked PRs compare against main, like every other check here.
          BASE_REF: ${{ (github.base_ref == 'main' || github.base_ref == '0.x') && github.base_ref || 'main' }}
        run: node .github/scripts/check-npm-packages-exist.mjs --since "origin/$BASE_REF"

  lint:
    name: Lint
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    if: needs.changes.outputs.has_code == 'true' && github.repository == 'mastra-ai/mastra'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:rw
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
      - name: Run lint and format checks
        run: pnpm lint

  check-bundle:
    name: Validate build outputs
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    if: needs.changes.outputs.has_code == 'true' && github.repository == 'mastra-ai/mastra'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build
        run: pnpm turbo --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*" build

      # The build transpiles without type checking, so a type error here would
      # otherwise reach main unnoticed: nothing else in CI runs this package's
      # `check` script, because the root `typecheck` task only visits packages
      # that define a `typecheck` script and this one is named `check`.
      - name: Validate Mastra Code types
        run: pnpm --filter ./mastracode/sdk check

      - name: Validate generated files are committed
        run: bash .github/scripts/check-clean-worktree.bash

      - name: Install test dependencies
        working-directory: ./e2e-tests/pkg-outputs
        run: pnpm install

      - name: Check bundles
        working-directory: ./e2e-tests/pkg-outputs
        run: pnpm test

  validator:
    name: Validate examples packages.json
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    if: needs.changes.outputs.has_examples == 'true' && github.repository == 'mastra-ai/mastra'
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          package-manager-cache: false
          install-dependencies: false

      - name: Install dependencies
        run: pnpm --config.trust-policy=no-check add -w --no-lockfile globby

      - name: Run examples validator
        run: node .github/scripts/validate-examples.js

  agents-md-check:
    name: Validate AGENTS.md files
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 10
    if: needs.changes.outputs.has_agents_inputs == 'true' && github.repository == 'mastra-ai/mastra'
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          package-manager-cache: false

      - name: Run AGENTS.md validator
        run: node .github/scripts/validate-agents-md.mjs

  readme-check:
    name: Validate package READMEs
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 10
    if: needs.changes.outputs.has_readme_inputs == 'true' && github.repository == 'mastra-ai/mastra'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          package-manager-cache: false
          install-dependencies: false

      - name: Run README validator
        run: node .github/scripts/check-package-readmes.mjs

  peerdeps-check:
    name: Validate peer dependencies
    needs: changes
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 30
    if: ${{ needs.changes.outputs.has_peerdeps_inputs == 'true' && github.repository == 'mastra-ai/mastra' }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          # Fetch entire git history so Changesets can generate changelogs
          # with the correct commits
          fetch-depth: 0
          # Partial clone: full history without every historical file version.
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          package-manager-cache: false
          install-dependencies: true

      - name: bump versions
        run: npx changeset pre exit && npx changeset version

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit changes
        run: git commit -am "Bump versions" || true

      - name: Run peerdeps validator
        run: node ./scripts/validate-peerdeps.mjs

      - name: Check @mastra/core import floor
        run: pnpm check:core-imports

      - name: Check for git changes
        run: |
          if ! git diff --quiet --ignore-space-at-eol -- ':!package.json' || ! git diff --cached --quiet --ignore-space-at-eol -- ':!package.json'; then
            echo "Error: Peerdependency mismatch"
            echo "The following files have been modified:"
            git diff --name-only -- ':!package.json'
            exit 1
          fi

  validate-pkg-json:
    name: Validate package.json files
    needs: changes
    runs-on: starsling-ubuntu-26.04-2
    timeout-minutes: 10
    if: needs.changes.outputs.has_code == 'true' && github.repository == 'mastra-ai/mastra'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Setup Node.js 22.x
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Run package.json validator
        run: node .github/scripts/validate-pkg-json.mjs
