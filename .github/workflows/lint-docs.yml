name: Lint Docs

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect docs changes
    runs-on: starsling-ubuntu-24.04
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Check for docs changes
        id: filter
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -qE '^docs/|^\.github/scripts/(check-deleted-pages|validate-redirects)\.js$|^\.github/workflows/lint-docs\.yml$'; then
            echo "docs=true" >> $GITHUB_OUTPUT
          else
            echo "docs=false" >> $GITHUB_OUTPUT
          fi

  check-deleted-pages:
    name: Check for deleted pages without redirects
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: starsling-ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Check for MDX changes
        id: mdx-changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q '\.mdx$'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.mdx-changes.outputs.has_changes == 'true'
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Check for removed pages without redirects
        if: steps.mdx-changes.outputs.has_changes == 'true'
        run: node .github/scripts/check-deleted-pages.js
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          COREPACK_ENABLE_STRICT: '0'

      - name: Comment on PR if redirects are missing
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const logsUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const identifier = '<!-- redirect-check: missing-redirects -->';
            const body = [
              identifier,
              '## 🚨 Missing Redirects Detected',
              '',
              'Some pages were removed in this PR but don\'t have corresponding redirects in `vercel.json`.',
              '',
              '**Action Required:** Add redirects for the deleted pages to prevent 404 errors.',
              '',
              `📋 [View workflow logs for details](${logsUrl})`
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const existingComment = comments.find(comment => comment.body.includes(identifier));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  comment_id: existingComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (error) {
              console.error('Failed to post comment:', error);
            }

  validate-redirects:
    name: Validate redirects
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: starsling-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Verify generated vercel redirects are up to date
        working-directory: ./docs
        run: |
          pnpm generate-vercel-redirects
          git diff --exit-code -- vercel.json vercel.redirects.json

      - name: Run validate-redirects
        run: node .github/scripts/validate-redirects.js

      - name: Comment on PR if redirect issues found
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const logsUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const identifier = '<!-- redirect-check: validate-redirects -->';
            const body = [
              identifier,
              '## 🚨 Redirect Validation Failed',
              '',
              'The redirect validation found issues in `vercel.json` (duplicate sources or broken destination links).',
              '',
              '**Action Required:** Review and fix the redirect configuration.',
              '',
              `📋 [View workflow logs for details](${logsUrl})`
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const existingComment = comments.find(comment => comment.body.includes(identifier));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  comment_id: existingComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (error) {
              console.error('Failed to post comment:', error);
            }

  lint-docs:
    name: Lint docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: starsling-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 0
          # Partial clone: name-only diffs need trees, not blob contents.
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Check formatting
        working-directory: ./docs
        run: pnpm format:check

      - name: Validate reference sidebar sort order
        working-directory: ./docs
        run: pnpm validate:reference-sidebar

      - name: Check for MDX changes
        id: mdx-changes
        shell: bash
        run: |
          set -euo pipefail
          # Three-dot diff compares against the merge-base so files that main
          # moved/deleted after the branch point are not reported as "added"
          # by a stale branch. The checkout is the PR merge ref, so also drop
          # anything that doesn't exist there.
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              -- \
              docs/src/content/en/docs \
              docs/src/content/en/integrations \
              docs/src/content/en/reference \
              | grep '\.mdx$' || true
          )

          files=()
          for f in "${changed[@]}"; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done

          if [ "${#files[@]}" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            printf '%s\n' "${files[@]}" | jq -R -s -c 'split("\n")[:-1]' \
              | sed 's/^/files=/' >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate frontmatter
        if: steps.mdx-changes.outputs.has_changes == 'true'
        working-directory: ./docs
        run: pnpm dlx tsx scripts/validate-frontmatter.ts

      - name: Check for docs not linked in sidebars
        if: steps.mdx-changes.outputs.has_changes == 'true'
        working-directory: ./docs
        run: pnpm validate:sidebar-docs

      - name: Lint with remark
        if: steps.mdx-changes.outputs.has_changes == 'true'
        working-directory: ./docs
        run: pnpm lint:remark

      - name: Prepare Vale CI config
        if: steps.mdx-changes.outputs.has_changes == 'true'
        run: |
          sed \
            -e '/^Packages =/d' \
            -e 's#^StylesPath = styles#StylesPath = docs/styles#' \
            docs/.vale.ini > .vale-ci.ini

      # vale-action pipes results through reviewdog, and every reviewdog
      # reporter (including github-check) downloads the PR diff, which the
      # GitHub API rejects on diffs larger than 20,000 lines. The files list
      # is already limited to changed MDX files by the local git diff above,
      # so run the Vale CLI directly and let its exit code gate the job.
      - name: Install Vale
        if: steps.mdx-changes.outputs.has_changes == 'true'
        env:
          VALE_VERSION: 3.19.0
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale --version

      - name: Lint with Vale
        if: steps.mdx-changes.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.mdx-changes.outputs.files }}
        run: |
          mapfile -t files < <(jq -r '.[]' <<< "$CHANGED_FILES")
          vale --config=.vale-ci.ini --minAlertLevel=error --output=line "${files[@]}"
