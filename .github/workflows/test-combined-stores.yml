name: Combined store Tests (vector+storage)

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false
      PINECONE_API_KEY:
        required: false
      ASTRA_DB_ENDPOINT:
        required: false
      ASTRA_DB_TOKEN:
        required: false
      ABHI_CLOUDFLARE_API_TOKEN:
        required: false
      ABHI_CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

jobs:
  setup:
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stores: ${{ steps.set-stores.outputs.stores }}
      light_stores: ${{ steps.set-stores.outputs.light_stores }}
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - id: set-stores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STORES=$(ls -d stores/*/ | grep -v '_test-utils' | cut -f2 -d'/' | jq -R -s -c 'split("\n")[:-1]')
          INVALID_STORES=$(echo "$STORES" | jq -r '.[] | select(test("^[a-zA-Z0-9_-]+$") | not)')
          if [[ -n "$INVALID_STORES" ]]; then
            echo "::error::Invalid store names: $INVALID_STORES"
            exit 1
          fi

          # Check if we should include vectorize tests
          # Only run vectorize tests for dane-ai-mastra bot's version packages PRs
          PR_DATA=$(gh api "/repos/${{ github.repository }}/commits/${{ inputs.head_sha }}/pulls" --jq '.[0] | {user: .user.login, title: .title}' 2>/dev/null || echo '{}')
          PR_USER=$(echo "$PR_DATA" | jq -r '.user // ""')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')
          IS_VERSIONING_PR=false
          if [[ "$PR_USER" == "dane-ai-mastra" ]] && [[ "$PR_TITLE" == "chore: version packages" || "$PR_TITLE" == "chore: version packages (alpha)" ]]; then
            IS_VERSIONING_PR=true
          fi

          if [[ "$IS_VERSIONING_PR" == "true" ]]; then
            echo "✓ This is a version packages PR from dane-ai-mastra bot - vectorize tests will run"
          else
            echo "✗ Not a version packages PR from dane-ai-mastra bot - filtering out vectorize tests"
            STORES=$(echo "$STORES" | jq -c '[.[] | select(. != "vectorize")]')
          fi

          # Stores whose tests need no container, no secrets and no network run together in
          # one job (test-light) instead of one runner each: their tests take seconds, less
          # than each runner's checkout, setup and build. A store not listed here keeps its own job.
          # libsql is deliberately not listed: its cross-process tests are load-sensitive.
          LIGHT='["azure-ai-search","convex","dsql","duckdb","lance","oracledb","s3vectors","spanner","turbopuffer","turso"]'
          LIGHT_STORES=$(jq -c -n --argjson all "$STORES" --argjson light "$LIGHT" '[$all[] | select(. as $s | $light | index($s))]')
          STORES=$(jq -c -n --argjson all "$STORES" --argjson light "$LIGHT" '[$all[] | select(. as $s | $light | index($s) | not)]')

          echo "stores=$STORES" >> $GITHUB_OUTPUT
          echo "light_stores=$LIGHT_STORES" >> $GITHUB_OUTPUT

  test:
    needs: setup
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        store: ${{fromJson(needs.setup.outputs.stores)}}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build combined storage packages
        run: pnpm turbo --filter "@mastra/${{ matrix.store }}" build
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Run ${{ matrix.store }} tests
        run: pnpm test
        working-directory: stores/${{ matrix.store }}
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          ASTRA_DB_ENDPOINT: ${{ secrets.ASTRA_DB_ENDPOINT }}
          ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ABHI_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ABHI_CLOUDFLARE_ACCOUNT_ID }}

  test-light:
    name: test (light stores)
    needs: setup
    if: ${{ github.repository == 'mastra-ai/mastra' && needs.setup.outputs.light_stores != '[]' }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Select light stores
        id: filters
        env:
          LIGHT_STORES: ${{ needs.setup.outputs.light_stores }}
        run: echo "args=$(jq -r 'map("--filter @mastra/" + .) | join(" ")' <<< "$LIGHT_STORES")" >> "$GITHUB_OUTPUT"

      - name: Build light storage packages
        run: pnpm turbo build ${{ steps.filters.outputs.args }}
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      # Each store runs its own `test` script and vitest config, four at a time.
      # --no-bail runs every store; the summary at the end names any that failed.
      - name: Run light store tests
        run: pnpm -r --workspace-concurrency=4 --no-bail --no-sort ${{ steps.filters.outputs.args }} run test
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
