name: Test tiers

# Keeps tiers.json on the orphan ci/test-tiers branch current. Prebuild's affected-test
# selection skips `out` files on PRs that don't edit them (scripts/test-tiers/select.mjs).
#
# - After a versioning-PR (changeset-release/*) Prebuild run fails, its failing unit test
#   files move `in`. For files and jobs that were `out` (escapes), `attribute` bisects the main
#   merges since the last green versioning run to find the one that broke each file, and `notify`
#   tells #eng-maintainer-alerts, tagging the PR author (scripts/test-tiers/attribute.mjs).
# - Daily, PR failures that the PR fixed in source (catches) restart their file's 30-day
#   clock, deleted files leave, and files clean for 30 days move `out`.
# - Bootstrap: run manually with seed=true to create the branch from scripts/test-tiers/seed.mjs.
# - Rollback: delete the ci/test-tiers branch; selection then runs every file.
on:
  workflow_run:
    workflows: [Prebuild]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Create ci/test-tiers from the seed if it doesn't exist
        type: boolean
        default: false
      scope:
        description: Seed scope (all = every test file, core-list = the timed core Affected UNIT files)
        type: choice
        options: [all, core-list]
        default: all

# Every run that updates the tiers writes the same file on the same branch, so those runs go one at a
# time and all wait their turn (queue: max). By default GitHub keeps one pending run per group and a
# job's `if` is only read when the run starts, so a Prebuild completion that would do nothing could
# replace a failed versioning run's pending update; those runs get a group of their own instead. The
# condition matches the update job's `if` apart from its repository check (workflow.test.mjs checks).
concurrency:
  group: >-
    ${{ (github.event_name != 'workflow_run' || (
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'changeset-release/')
    )) && 'test-tiers' || format('test-tiers-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  update:
    name: Update test tiers
    if: >-
      github.repository == 'mastra-ai/mastra' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'changeset-release/')
        )
      )
    runs-on: starsling-ubuntu-26.04
    outputs:
      escapes: ${{ steps.escapes.outputs.escapes }}
      has_escapes: ${{ steps.escapes.outputs.has_escapes }}
      fallback: ${{ steps.escapes.outputs.fallback }}
    # The daily update fetches jobs for unsuccessful PR runs in 14 days it hasn't settled yet, one call at a
    # time, and stops after 45 minutes (update.mjs DAILY_BUDGET_MINUTES), saving what it has.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: false

      - name: Check out ci/test-tiers
        id: branch
        env:
          SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin ci/test-tiers > /dev/null; then
            git fetch --depth 1 origin ci/test-tiers
            git worktree add --detach "$RUNNER_TEMP/tiers" FETCH_HEAD
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$SEED" = "true" ]; then
            git worktree add --detach "$RUNNER_TEMP/tiers"
            git -C "$RUNNER_TEMP/tiers" switch --orphan ci/test-tiers
            node scripts/test-tiers/seed.mjs --scope="$SCOPE" --out="$RUNNER_TEMP/tiers/tiers.json"
            git -C "$RUNNER_TEMP/tiers" add tiers.json
            git -C "$RUNNER_TEMP/tiers" commit --quiet -m "test tiers: seed ($SCOPE)"
            git -C "$RUNNER_TEMP/tiers" push origin HEAD:refs/heads/ci/test-tiers
            echo "Seeded ci/test-tiers ($SCOPE)."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "No ci/test-tiers branch; run this workflow with seed=true to create it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move versioning-PR failures in
        if: steps.branch.outputs.exists == 'true' && github.event_name == 'workflow_run'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node scripts/test-tiers/update.mjs versioning --tiers="$RUNNER_TEMP/tiers/tiers.json" --run-id="$RUN_ID" \
            --escapes-out="$RUNNER_TEMP/escapes.json"

      - name: List escapes for attribution
        id: escapes
        if: steps.branch.outputs.exists == 'true' && github.event_name == 'workflow_run'
        env:
          TIERS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          escapes="$RUNNER_TEMP/escapes.json"
          echo "escapes=$(jq -c . "$escapes")" >> "$GITHUB_OUTPUT"
          if [ "$(jq '(.files | length) + (.jobs | length)' "$escapes")" -gt 0 ]; then
            echo "has_escapes=true" >> "$GITHUB_OUTPUT"
            echo "fallback=$(node scripts/test-tiers/attribute.mjs fallback --escapes="$escapes" --tiers-run-url="$TIERS_RUN_URL")" >> "$GITHUB_OUTPUT"
          fi

      - name: Record PR catches and move clean files out
        if: steps.branch.outputs.exists == 'true' && github.event_name != 'workflow_run'
        run: node scripts/test-tiers/update.mjs daily --tiers="$RUNNER_TEMP/tiers/tiers.json"

      - name: Commit tiers.json
        if: steps.branch.outputs.exists == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cd "$RUNNER_TEMP/tiers"
          if git diff --quiet; then
            echo "tiers.json unchanged."
            exit 0
          fi
          git add tiers.json
          git commit --quiet -m "test tiers: update ($EVENT)"
          git push origin HEAD:refs/heads/ci/test-tiers

  # Finds the main merge that broke each escaped file. Runs main first-parent commits only, never the
  # versioning head or a PR head, and holds no Slack token.
  attribute:
    name: Attribute escapes
    needs: update
    if: needs.update.outputs.has_escapes == 'true'
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      # StarSling Disks pnpm store (see setup-pnpm-node).
      id-token: write
    outputs:
      messages: ${{ steps.attribute.outputs.messages }}
      count: ${{ steps.attribute.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:r' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: false

      - name: Bisect
        id: attribute
        env:
          ESCAPES: ${{ needs.update.outputs.escapes }}
        run: |
          printf '%s' "$ESCAPES" > "$RUNNER_TEMP/escapes.json"
          node scripts/test-tiers/attribute.mjs run --escapes="$RUNNER_TEMP/escapes.json" \
            --out="$RUNNER_TEMP/attribution.json" --workdir="$RUNNER_TEMP/bisect"
          echo "messages=$(jq -c .messages "$RUNNER_TEMP/attribution.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.messages | length' "$RUNNER_TEMP/attribution.json")" >> "$GITHUB_OUTPUT"
          {
            echo '### Test-tier escape attribution'
            jq -r '.results[] | "- `\(.file)`: \(.verdict)\(if .culprit then " (\(.culprit[0:10]))" else "" end)\(if .candidates then " (one of \(.candidates | map(.[0:10]) | join(", ")))" else "" end)\(if .reason then " (\(.reason))" else "" end)"' "$RUNNER_TEMP/attribution.json"
          } >> "$GITHUB_STEP_SUMMARY"

  # Posts what attribute found, or, when it failed or timed out, which files escaped. The only job with
  # the Slack token: it runs no repository code besides the slack-alert action from main.
  notify:
    name: Notify ${{ strategy.job-index }}
    needs: [update, attribute]
    if: >-
      !cancelled() && needs.update.outputs.has_escapes == 'true' &&
      (needs.attribute.result != 'success' || needs.attribute.outputs.count != '0')
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        text: ${{ fromJSON(needs.attribute.result == 'success' && needs.attribute.outputs.messages || needs.update.outputs.fallback) }}
    steps:
      - name: Checkout the Slack action
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          ref: main
          sparse-checkout: .github/actions/slack-alert
          persist-credentials: false

      - name: Post to Slack
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: ${{ matrix.text }}
