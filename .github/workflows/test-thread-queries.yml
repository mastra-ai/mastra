name: Thread query storage tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/src/storage/domains/observability/thread-query*'
      - 'stores/_test-utils/src/domains/observability-vnext/thread-query.ts'
      - 'stores/clickhouse/src/storage/domains/observability/v-next/**'
      - 'stores/pg/src/storage/domains/observability/v-next/**'
      - 'stores/duckdb/src/storage/domains/observability/**'
      - '.github/workflows/test-thread-queries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-queries-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  storage:
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: clickhouse
            test: src/storage/domains/observability/v-next/span-query.test.ts
          - store: pg
            test: src/storage/domains/observability/v-next/span-query.test.ts
          - store: duckdb
            test: src/storage/domains/observability/span-query.test.ts
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-node
      - name: Build storage dependencies
        run: pnpm turbo build --filter='@mastra/${{ matrix.store }}...'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Start database
        if: matrix.store != 'duckdb'
        working-directory: stores/${{ matrix.store }}
        run: docker compose up -d --wait
      - name: Wait for PostgreSQL
        if: matrix.store == 'pg'
        run: |
          for attempt in {1..30}; do
            if docker exec pg-test-db pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run real storage conformance with both query strategies
        working-directory: stores/${{ matrix.store }}
        run: pnpm exec vitest run '${{ matrix.test }}'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Stop database
        if: always() && matrix.store != 'duckdb'
        working-directory: stores/${{ matrix.store }}
        run: docker compose down -v
